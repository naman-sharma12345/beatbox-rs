[package]
name = "beatbox"
version = "0.1.0"
edition = "2021"
description = "An AI-native beat maker in Rust: synths, drums, samples, FX, theory generators and a mix analyzer, all exposed as MCP tools, with a browser studio"
license = "MIT"
repository = "https://github.com/naman-sharma12345/beatbox-rs"
readme = "README.md"
keywords = ["music", "daw", "mcp", "synthesizer", "ai"]
categories = ["multimedia::audio", "command-line-utilities"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5", features = ["mp3"] }
tiny_http = "0.12"
ureq = { version = "2", features = ["json"] }
eframe = { version = "0.29", optional = true }
cpal = { version = "0.15", optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[profile.release]
lto = "thin"

[profile.dev]
opt-level = 2

[features]
default = []
gui = ["dep:eframe", "dep:cpal", "dep:image"]
