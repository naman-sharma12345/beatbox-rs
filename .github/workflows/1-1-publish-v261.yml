name: Publish channel removal control preservation validation
'on':
  push:
    branches:
    - channel-removal
    paths:
    - .github/workflows/*publish-v261.yml
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'naman-sharma12345/beatbox-rs' && github.actor == 'naman-sharma12345'
      && github.ref == 'refs/heads/channel-removal'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Apply exact locally tested sample preservation patch
      shell: bash
      run: 'set -euo pipefail

        [ "$(git rev-parse HEAD^)" = b2a2273cd31a8b92ce7b73cf2331ed8157ad1417 ]

        [ "$(git rev-parse origin/main)" = b2a2273cd31a8b92ce7b73cf2331ed8157ad1417
        ]

        python3 - <<''PYCODE''

        import base64,gzip,hashlib,pathlib

        b=gzip.decompress(base64.b64decode(''''))

        assert hashlib.sha256(b).hexdigest()==''eec4c1aba5cf1adf45a46f15971bddbe1190acd329fa436b1cb1e62335f76452''

        pathlib.Path(''/tmp/checked.patch'').write_bytes(b)

        PYCODE

        git apply --check /tmp/checked.patch

        git apply /tmp/checked.patch

        python3 - <<''PYCODE''

        import hashlib,pathlib

        expected={''src/tools.rs'': ''0685198a7f74463f03417488577a985b9a8a6e912b3a8cd57d9e1eb1835dd1c0'',
        ''src/tools_studio.rs'': ''d12340379de2bb10276150f42a6fcd823e948afcec3d901655f83fe6d3f8206f'',
        ''tests/channel_remove_targets.rs'': ''34a8d4b48590c95906d569ceeed32baf632a9606694f5e6d6d00b27e25060f9e''}

        for f,h in expected.items(): assert hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest()==h,f

        PYCODE

        git config user.name ''github-actions[bot]''

        git config user.email ''41898282+github-actions[bot]@users.noreply.github.com''

        git add src/tools.rs src/tools_studio.rs tests/channel_remove_targets.rs

        git commit -m "Drop deleted channel controls before name reuse"

        git fetch origin channel-removal main

        [ "$(git rev-parse origin/channel-removal)" = "$GITHUB_SHA" ]

        [ "$(git rev-parse origin/main)" = b2a2273cd31a8b92ce7b73cf2331ed8157ad1417
        ]

        git push origin HEAD:refs/heads/channel-removal

        '
