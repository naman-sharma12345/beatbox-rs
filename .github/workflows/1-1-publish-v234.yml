name: Publish processed sample file preservation
'on':
  push:
    branches:
    - sample-guard
    paths:
    - .github/workflows/*publish-v234.yml
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'naman-sharma12345/beatbox-rs' && github.actor == 'naman-sharma12345'
      && github.ref == 'refs/heads/sample-guard'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Apply exact locally tested sample preservation patch
      shell: bash
      run: 'set -euo pipefail

        [ "$(git rev-parse HEAD^)" = 89042a57fe56e8ee73cea8a15a6cc14556df7009 ]

        [ "$(git rev-parse origin/main)" = 89042a57fe56e8ee73cea8a15a6cc14556df7009
        ]

        python3 - <<''PYCODE''

        import base64,gzip,hashlib,pathlib

        b=gzip.decompress(base64.b64decode(''''))

        assert hashlib.sha256(b).hexdigest()==''1bc991a30b09cc92948c7b8227c7d0bd0507c5bb47f1ec8d4237b7e138b60da1''

        pathlib.Path(''/tmp/checked.patch'').write_bytes(b)

        PYCODE

        git apply --check /tmp/checked.patch

        git apply /tmp/checked.patch

        python3 - <<''PYCODE''

        import hashlib,pathlib

        expected={''src/sc_strip.rs'': ''5f7f4df2ae158e629d6be761adf05ece8654bd5762ecbf15b0027c5473a39788'',
        ''tests/processed_sample_preservation.rs'': ''318d151019704c55ebc533e6b1e2855dd4e810fb2d47209e4533fbc0d319f184''}

        for f,h in expected.items(): assert hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest()==h,f

        PYCODE

        git config user.name ''github-actions[bot]''

        git config user.email ''41898282+github-actions[bot]@users.noreply.github.com''

        git add src/sc_strip.rs tests/processed_sample_preservation.rs

        git commit -m "Preserve source and previous files when saving processed sample
        candidates"

        git fetch origin sample-guard main

        [ "$(git rev-parse origin/sample-guard)" = "$GITHUB_SHA" ]

        [ "$(git rev-parse origin/main)" = 89042a57fe56e8ee73cea8a15a6cc14556df7009
        ]

        git push origin HEAD:refs/heads/sample-guard

        '
