name: Publish silence-trim file preservation
'on':
  push:
    branches:
    - silence-guard
    paths:
    - .github/workflows/*publish-v235.yml
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'naman-sharma12345/beatbox-rs' && github.actor == 'naman-sharma12345'
      && github.ref == 'refs/heads/silence-guard'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Apply exact locally tested sample preservation patch
      shell: bash
      run: 'set -euo pipefail

        [ "$(git rev-parse HEAD^)" = 7a713b602e7bb4e028fe1b0e2c00463b5320a1c0 ]

        [ "$(git rev-parse origin/main)" = 7a713b602e7bb4e028fe1b0e2c00463b5320a1c0
        ]

        python3 - <<''PYCODE''

        import base64,gzip,hashlib,pathlib

        b=gzip.decompress(base64.b64decode(''''))

        assert hashlib.sha256(b).hexdigest()==''8f5b801b2db28125f488b1bfcce589be5467ed021c996ee702a71ca388d52b1f''

        pathlib.Path(''/tmp/checked.patch'').write_bytes(b)

        PYCODE

        git apply --check /tmp/checked.patch

        git apply /tmp/checked.patch

        python3 - <<''PYCODE''

        import hashlib,pathlib

        expected={''src/tools_mix.rs'': ''700858f0018cf05e973c5d09737afbe7c9560944ee09ccda5dcd312da810be91'',
        ''tests/strip_silence_preservation.rs'': ''e9f55080ba7ad5fba54e0c7772a565331342578f4ddfda3d49b0877f63211fe6''}

        for f,h in expected.items(): assert hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest()==h,f

        PYCODE

        git config user.name ''github-actions[bot]''

        git config user.email ''41898282+github-actions[bot]@users.noreply.github.com''

        git add src/tools_mix.rs tests/strip_silence_preservation.rs

        git commit -m "Preserve source and earlier silence-trim candidates"

        git fetch origin silence-guard main

        [ "$(git rev-parse origin/silence-guard)" = "$GITHUB_SHA" ]

        [ "$(git rev-parse origin/main)" = 7a713b602e7bb4e028fe1b0e2c00463b5320a1c0
        ]

        git push origin HEAD:refs/heads/silence-guard

        '
