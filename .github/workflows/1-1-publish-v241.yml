name: Publish open sample browser workflow
'on':
  push:
    branches:
    - own-samples
    paths:
    - .github/workflows/*publish-v241.yml
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'naman-sharma12345/beatbox-rs' && github.actor == 'naman-sharma12345'
      && github.ref == 'refs/heads/own-samples'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Apply exact locally tested sample preservation patch
      shell: bash
      run: 'set -euo pipefail

        [ "$(git rev-parse HEAD^)" = 05105974d219c2a1c737de11f67d6027b23eac1a ]

        [ "$(git rev-parse origin/main)" = 05105974d219c2a1c737de11f67d6027b23eac1a
        ]

        python3 - <<''PYCODE''

        import base64,gzip,hashlib,pathlib

        b=gzip.decompress(base64.b64decode(''''))

        assert hashlib.sha256(b).hexdigest()==''b398cf06d734512d66107cc999a281cbcf9ecd58a2f9ab542f44e62975809cfc''

        pathlib.Path(''/tmp/checked.patch'').write_bytes(b)

        PYCODE

        git apply --check /tmp/checked.patch

        git apply /tmp/checked.patch

        python3 - <<''PYCODE''

        import hashlib,pathlib

        expected={''src/gui/browser_view.rs'': ''6e3652a5f369bfb8ae95896d561f8e9161c335e9123f31a2f2eef6b06d500dd0'',
        ''tests/own_samples.rs'': ''6421e7ccd185734315651746c6a4c13297da6ae644ace76f3adf28f0a7e6381d''}

        for f,h in expected.items(): assert hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest()==h,f

        PYCODE

        git config user.name ''github-actions[bot]''

        git config user.email ''41898282+github-actions[bot]@users.noreply.github.com''

        git add src/gui/browser_view.rs tests/own_samples.rs

        git commit -m "Put own samples and source audition first in Browser"

        git fetch origin own-samples main

        [ "$(git rev-parse origin/own-samples)" = "$GITHUB_SHA" ]

        [ "$(git rev-parse origin/main)" = 05105974d219c2a1c737de11f67d6027b23eac1a
        ]

        git push origin HEAD:refs/heads/own-samples

        '
