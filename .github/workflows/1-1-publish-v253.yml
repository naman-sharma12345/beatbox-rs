name: Publish stereo alignment validation
'on':
  push:
    branches:
    - stereo-align
    paths:
    - .github/workflows/*publish-v253.yml
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'naman-sharma12345/beatbox-rs' && github.actor == 'naman-sharma12345'
      && github.ref == 'refs/heads/stereo-align'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Apply exact locally tested sample preservation patch
      shell: bash
      run: 'set -euo pipefail

        [ "$(git rev-parse HEAD^)" = a7d75138634ebdd6b5ffd9d50325529cbc3132e7 ]

        [ "$(git rev-parse origin/main)" = a7d75138634ebdd6b5ffd9d50325529cbc3132e7
        ]

        python3 - <<''PYCODE''

        import base64,gzip,hashlib,pathlib

        b=gzip.decompress(base64.b64decode(''''))

        assert hashlib.sha256(b).hexdigest()==''1e2b2b2cc6e3880b26e2e2ffa95f1b7ac6cfebfcebdb69c9f321c4b91a825217''

        pathlib.Path(''/tmp/checked.patch'').write_bytes(b)

        PYCODE

        git apply --check /tmp/checked.patch

        git apply /tmp/checked.patch

        python3 - <<''PYCODE''

        import hashlib,pathlib

        expected={''src/audio_edit.rs'': ''6f97d00771a22281f3b19410f4cec8dacd1b8949ce7051a34620da03d9e1c49f'',
        ''src/tools_sound.rs'': ''a53a9f557c7c806a98bb06460c0d7f76fcf59bfc4275b112c37f51892ed79b6a'',
        ''tests/stereo_alignment.rs'': ''89c28183f7c87d9daa2e194741029bc5295ed8718b798862934b46963c4971a6''}

        for f,h in expected.items(): assert hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest()==h,f

        PYCODE

        git config user.name ''github-actions[bot]''

        git config user.email ''41898282+github-actions[bot]@users.noreply.github.com''

        git add src/audio_edit.rs src/tools_sound.rs tests/stereo_alignment.rs

        git commit -m "Preserve stereo sources when aligning recorded takes"

        git fetch origin stereo-align main

        [ "$(git rev-parse origin/stereo-align)" = "$GITHUB_SHA" ]

        [ "$(git rev-parse origin/main)" = a7d75138634ebdd6b5ffd9d50325529cbc3132e7
        ]

        git push origin HEAD:refs/heads/stereo-align

        '
