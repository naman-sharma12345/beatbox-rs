name: Publish effect target preservation validation
'on':
  push:
    branches:
    - fx-targets
    paths:
    - .github/workflows/*publish-v259.yml
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'naman-sharma12345/beatbox-rs' && github.actor == 'naman-sharma12345'
      && github.ref == 'refs/heads/fx-targets'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Apply exact locally tested sample preservation patch
      shell: bash
      run: 'set -euo pipefail

        [ "$(git rev-parse HEAD^)" = ef017b71d46faea8892c138f4f0ba4d42438ff5c ]

        [ "$(git rev-parse origin/main)" = ef017b71d46faea8892c138f4f0ba4d42438ff5c
        ]

        python3 - <<''PYCODE''

        import base64,gzip,hashlib,pathlib

        b=gzip.decompress(base64.b64decode(''''))

        assert hashlib.sha256(b).hexdigest()==''f34b15499aac06b1a2abd28e57830665bab4c6d008399f83dd117b45204ea99f''

        pathlib.Path(''/tmp/checked.patch'').write_bytes(b)

        PYCODE

        git apply --check /tmp/checked.patch

        git apply /tmp/checked.patch

        python3 - <<''PYCODE''

        import hashlib,pathlib

        expected={''src/tools_fx2.rs'': ''c541cbdddb2e4b04a2b93a241351c7113bc339e2e2f1d165ea97e52be2d27ea3'',
        ''src/tools_studio.rs'': ''c16b98bd83ef6209d73d3f589a5e017be63f871a5940d10f12279977c9dcb2a3'',
        ''src/tools_sound.rs'': ''ccea4da9f4fc793130e481eb57ee686289342ba0ca0e04af8b707b546455a38a'',
        ''tests/fx_move_automation.rs'': ''b0c72e7e246f3d7f4deb1ad92d787be35747753a110f85c8af42b4f6424353ae''}

        for f,h in expected.items(): assert hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest()==h,f

        PYCODE

        git config user.name ''github-actions[bot]''

        git config user.email ''41898282+github-actions[bot]@users.noreply.github.com''

        git add src/tools_fx2.rs src/tools_studio.rs src/tools_sound.rs tests/fx_move_automation.rs

        git commit -m "Preserve automation clip and macro targets through FX edits"

        git fetch origin fx-targets main

        [ "$(git rev-parse origin/fx-targets)" = "$GITHUB_SHA" ]

        [ "$(git rev-parse origin/main)" = ef017b71d46faea8892c138f4f0ba4d42438ff5c
        ]

        git push origin HEAD:refs/heads/fx-targets

        '
