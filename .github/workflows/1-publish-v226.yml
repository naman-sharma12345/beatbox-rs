name: Publish Mixer vocal room report
'on':
  push:
    branches:
    - vocal-room
    paths:
    - .github/workflows/*publish-v226.yml
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'naman-sharma12345/beatbox-rs' && github.actor == 'naman-sharma12345'
      && github.ref == 'refs/heads/vocal-room'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Apply verified selectable excerpt patch
      shell: bash
      run: "set -euo pipefail\n[ \"$(git rev-parse HEAD^)\" = d3b6861a9d37e87315292a8d0387671778d02b2c\
        \ ]\n[ \"$(git rev-parse origin/main)\" = d3b6861a9d37e87315292a8d0387671778d02b2c\
        \ ]\npython3 - <<'PYCODE'\nimport base64,gzip,hashlib,pathlib\nb=gzip.decompress(base64.b64decode(''))\n\
        assert hashlib.sha256(b).hexdigest()=='051b316516db6400570e49e3ac79da8ea98e0fb37d956cfebd120ac8b155f33c'\n\
        pathlib.Path('/tmp/verified.patch').write_bytes(b)\nPYCODE\ngit apply --check\
        \ /tmp/verified.patch\ngit apply /tmp/verified.patch\npython3 - <<'PYCODE'\n\
        import hashlib,pathlib\nexpected={'src/gui/views.rs': 'c5772a6c8aa8744d751b6e2ccf69c3312e75f4d3897984824e91623cb817e2cd',\
        \ 'src/gui/manual_ui_tests.rs': 'ca3a7b7d8c9e50acc3be12eadd82ecc3e2fcbc9e8119feaf61db9190edb9cfae'}\n\
        for f,h in expected.items():\n assert hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest()==h,f\n\
        PYCODE\ngit config user.name 'github-actions[bot]'\ngit config user.email\
        \ '41898282+github-actions[bot]@users.noreply.github.com'\ngit add src/gui/views.rs\
        \ src/gui/manual_ui_tests.rs\ngit commit -m \"Add read-only vocal room report\
        \ to Mixer\"\ngit fetch origin vocal-room main\n[ \"$(git rev-parse origin/vocal-room)\"\
        \ = \"$GITHUB_SHA\" ]\n[ \"$(git rev-parse origin/main)\" = d3b6861a9d37e87315292a8d0387671778d02b2c\
        \ ]\ngit push origin HEAD:refs/heads/vocal-room\n"
