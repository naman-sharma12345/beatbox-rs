name: Fix denoise regression test module paths
'on':
  push:
    branches:
    - denoise-guard
    paths:
    - .github/workflows/*fix-v233.yml
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'naman-sharma12345/beatbox-rs' && github.actor == 'naman-sharma12345'
      && github.ref == 'refs/heads/denoise-guard'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Apply exact locally tested denoise guard
      shell: bash
      run: 'set -euo pipefail

        [ "$(git rev-parse HEAD^)" = 0c6854090fd4f4c653b776bc8fdef4ba594c82b1 ]

        python3 - <<''PYCODE''

        import base64,gzip,pathlib

        pathlib.Path(''/tmp/fix.patch'').write_bytes(gzip.decompress(base64.b64decode('''')))

        PYCODE

        git apply --check /tmp/fix.patch

        git apply /tmp/fix.patch

        python3 - <<''PYCODE''

        import pathlib,hashlib

        assert hashlib.sha256(pathlib.Path(''src/voice_ai.rs'').read_bytes()).hexdigest()==''35dd71e39c3e2eeac1fba9e696f0bfcc2877e909e98b332a0475f1b196b7ede0''

        PYCODE

        git config user.name ''github-actions[bot]''

        git config user.email ''41898282+github-actions[bot]@users.noreply.github.com''

        git add src/voice_ai.rs

        git commit -m "Use crate-relative paths in denoise dispatch regression"

        git fetch origin denoise-guard main

        [ "$(git rev-parse origin/denoise-guard)" = "$GITHUB_SHA" ]

        [ "$(git rev-parse origin/main)" = 8206b4afbb8b69a4bf707fee47d39067b2fa3fa4
        ]

        git push origin HEAD:refs/heads/denoise-guard

        '
