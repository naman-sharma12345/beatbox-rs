name: Publish source excerpt mono measurement
'on':
  push:
    branches:
    - mono-check
    paths:
    - .github/workflows/*publish-v231.yml
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'naman-sharma12345/beatbox-rs' && github.actor == 'naman-sharma12345'
      && github.ref == 'refs/heads/mono-check'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Apply verified source mono measurement patch
      shell: bash
      run: "set -euo pipefail\n[ \"$(git rev-parse HEAD^)\" = aa6a2227d9f5581681fc19f34da2f4253397e0c2\
        \ ]\n[ \"$(git rev-parse origin/main)\" = aa6a2227d9f5581681fc19f34da2f4253397e0c2\
        \ ]\npython3 - <<'PYCODE'\nimport base64,gzip,hashlib,pathlib\nb=gzip.decompress(base64.b64decode(''))\n\
        assert hashlib.sha256(b).hexdigest()=='a96aa3e9df03a302e7161dbc855df3dd8690a33ff00ceac5bac362d00ab046ba'\n\
        pathlib.Path('/tmp/verified.patch').write_bytes(b)\nPYCODE\ngit apply --check\
        \ /tmp/verified.patch\ngit apply /tmp/verified.patch\npython3 - <<'PYCODE'\n\
        import hashlib,pathlib\nexpected={'src/gui/browser_view.rs': '061105dd1af17d1310e935f4530eb5548fe2a5e27063391542392fd6e933dd4f',\
        \ 'src/tools_chain.rs': '2490ef35640d648b438b8dda3268f56180ab8474170236e69adc6e6bba885c65'}\n\
        for f,h in expected.items():\n assert hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest()==h,f\n\
        PYCODE\ngit config user.name 'github-actions[bot]'\ngit config user.email\
        \ '41898282+github-actions[bot]@users.noreply.github.com'\ngit add src/gui/browser_view.rs\
        \ src/tools_chain.rs\ngit commit -m \"Measure source excerpt mono fold change\
        \ before monitoring transforms\"\ngit fetch origin mono-check main\n[ \"$(git\
        \ rev-parse origin/mono-check)\" = \"$GITHUB_SHA\" ]\n[ \"$(git rev-parse\
        \ origin/main)\" = aa6a2227d9f5581681fc19f34da2f4253397e0c2 ]\ngit push origin\
        \ HEAD:refs/heads/mono-check\n"
