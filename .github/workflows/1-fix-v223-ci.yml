name: Publish verified checkpoint A/B audition
on:
  push:
    branches:
    - checkpoint-ab
    paths:
    - .github/workflows/*fix-v223-ci.yml
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'naman-sharma12345/beatbox-rs' && github.actor == 'naman-sharma12345'
      && github.ref == 'refs/heads/checkpoint-ab'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Apply hash-verified clean-runner regression corrections
      shell: bash
      run: "set -euo pipefail\n[ \"$(git rev-parse HEAD^)\" = 9882cf6d3ed72c1633320223fe8aa5fe6e56c0b7\
        \ ]\n[ \"$(git rev-parse origin/main)\" = 9882cf6d3ed72c1633320223fe8aa5fe6e56c0b7\
        \ ]\npython3 - <<'PYCODE'\nimport base64,hashlib,pathlib,gzip\nb=gzip.decompress(base64.b64decode(''))\n\
        assert hashlib.sha256(b).hexdigest()=='0e1f867e4f179afaa442adb2995cfb62f290accdcc38b8bdc8cb10f1e6941593'\n\
        pathlib.Path('/tmp/ci-fix.patch').write_bytes(b)\nPYCODE\ngit apply --check\
        \ /tmp/ci-fix.patch\ngit apply /tmp/ci-fix.patch\npython3 - <<'PYCODE'\nimport\
        \ pathlib,hashlib\nexpected={'src/gui/mod.rs': 'b4536a2756bfe66d3bc48b844d385a6c4b8619216d6ed75bab170c956ed7ab85',\
        \ 'src/gui/views.rs': '2e73534f3cb363a93cd6aca6d6ac0d4ce72119cca90ef61042717ac4f1540217',\
        \ 'src/gui/manual_ui_tests.rs': 'f1e72069ca953d62cd361569c596833fb05e85c2207b2bc3103904310eb80198',\
        \ 'src/gui/player.rs': '303ff7786f86f24e1db2a8d131ca4cef92cfd42080cfe817f1ce34a9f26071b4'}\n\
        for f,h in expected.items():\n assert hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest()==h,f\n\
        PYCODE\ngit config user.name 'github-actions[bot]'\ngit config user.email\
        \ '41898282+github-actions[bot]@users.noreply.github.com'\ngit add src tests\
        \ scripts\ngit commit -m \"Add matched checkpoint comparison to the Mixer\"\
        \ngit fetch origin checkpoint-ab main\n[ \"$(git rev-parse origin/checkpoint-ab)\"\
        \ = \"$GITHUB_SHA\" ]\n[ \"$(git rev-parse origin/main)\" = 9882cf6d3ed72c1633320223fe8aa5fe6e56c0b7\
        \ ]\ngit push origin HEAD:refs/heads/checkpoint-ab\n"
