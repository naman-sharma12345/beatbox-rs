name: Publish send identity preservation validation
'on':
  push:
    branches:
    - send-identity
    paths:
    - .github/workflows/*publish-v263.yml
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'naman-sharma12345/beatbox-rs' && github.actor == 'naman-sharma12345'
      && github.ref == 'refs/heads/send-identity'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Apply exact locally tested sample preservation patch
      shell: bash
      run: 'set -euo pipefail

        [ "$(git rev-parse HEAD^)" = 43f951353a1df365c0342cee3a59085edd7eb851 ]

        [ "$(git rev-parse origin/main)" = 43f951353a1df365c0342cee3a59085edd7eb851
        ]

        python3 - <<''PYCODE''

        import base64,gzip,hashlib,pathlib

        b=gzip.decompress(base64.b64decode(''''))

        assert hashlib.sha256(b).hexdigest()==''42546876da8ebe2ea411d1407e2e3e28e8437dfb5ab91ef3b9e443d0af608379''

        pathlib.Path(''/tmp/checked.patch'').write_bytes(b)

        PYCODE

        git apply --check /tmp/checked.patch

        git apply /tmp/checked.patch

        python3 - <<''PYCODE''

        import hashlib,pathlib

        expected={''src/tools_studio.rs'': ''ccc9df1207449f355b079421dfeaadbaaf47ae3e50fdc8759ef6f87a9fbb4053'',
        ''tests/send_id_targets.rs'': ''7e2e98990a2bf3ddaf601f34e093ae03bd80945169e4bb650830a4827d2f96b2''}

        for f,h in expected.items(): assert hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest()==h,f

        PYCODE

        git config user.name ''github-actions[bot]''

        git config user.email ''41898282+github-actions[bot]@users.noreply.github.com''

        git add src/tools_studio.rs tests/send_id_targets.rs

        git commit -m "Preserve stable send identity and clean ID targets"

        git fetch origin send-identity main

        [ "$(git rev-parse origin/send-identity)" = "$GITHUB_SHA" ]

        [ "$(git rev-parse origin/main)" = 43f951353a1df365c0342cee3a59085edd7eb851
        ]

        git push origin HEAD:refs/heads/send-identity

        '
