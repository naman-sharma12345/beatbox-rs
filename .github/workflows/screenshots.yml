            require(not stopped[0],'helper cancellation')\n            same_process(caller_id,process(caller.pid)); environment(caller.pid,expected)\n        def studio(pid):\n            info=process(pid)\n            require(info['ppid']==caller.pid and info['exe']==exe_id and info['pgid']==group and info['sid']==group,'Studio ancestry/group/exe')\n            args=info['argv']\n            require(len(args)==7 and pathlib.Path(args[0]).resolve()==binary and args[1]=='studio'\n                    and args[3:]==['--screenshot',request['out'],'--view','sequencer'],'Studio argv')\n            environment(pid,expected)\n            return info,typed_path(args[2],caller.pid)\n        def inspect():\n            owned()\n            x.atoms={name:int(x.lib.XInternAtom(x.display,name.encode(),1)) for name in x.atoms}\n            x.sync()\n            children=bounded_read(f'/proc/{caller.pid}/task/{caller.pid}/children',4096).split()\n            require(len(children)<=256,'process child cap')\n            owners={}\n            for child in children:\n                pid=int(child)\n                # Every direct child is fail-closed, not a name-search fallback.\n                info,path=studio(pid); owners[pid]=(info,path)\n            require(len(owners)<=1,'ambiguous Studio children')\n            candidates=[]; details={}; unknown_visible=[]\n            for window,parent in x.tree():\n                a=x.attrs(window)\n                pid=x.prop(window,'_NET_WM_PID',6,32,1)\n                if pid in owners:\n                    title=x.prop(window,'_NET_WM_NAME',x.atoms['UTF8_STRING'],8,1024)\n                    if title is None: continue # no legacy/title-only fallback\n                    require(title.decode('utf-8',errors='strict')=='Beatbox Studio','owner title mismatch')\n                    if eligible(a,x.root,w,h):\n                        candidates.append(window); details[window]=(owners[pid],a)\n                elif a['class']==1 and a['map_state']=