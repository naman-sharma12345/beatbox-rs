name: screenshots
# Fresh GUI screenshots of Beatbox Studio with a real produced beat loaded.
# Uses the repo's own `screenshot` tool (tools_parity.rs), which spawns
# `beatbox studio --screenshot` under xvfb-run when there is no display.
on:
  workflow_dispatch:
  push:
    branches: [main]
env:
  CARGO_TERM_COLOR: always
  SHOT_TAG: s9b
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: system deps (GUI build + headless X)
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config libxkbcommon-dev libwayland-dev libx11-dev \
            xvfb xauth libgl1-mesa-dri libegl1 libxkbcommon-x11-0 libxcursor1 libxrandr2 libxi6 python3
      - name: build (release, GUI feature)
        run: |
          mkdir -p shots
          git rev-parse HEAD > shots/build-sha.txt
          rustc --version --verbose > shots/rustc.txt
          BEATBOX_BUILD_SHA="$(cat shots/build-sha.txt)" cargo build --release
          sha256sum target/release/beatbox > shots/binary-sha256.txt
          python3 - <<'PYPROV'
          import json, os, subprocess
          from pathlib import Path
          Path('shots/checkout.json').write_text(json.dumps({
              'checkout_sha': subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
              'github_sha': os.environ.get('GITHUB_SHA'),
              'event': os.environ.get('GITHUB_EVENT_NAME'),
              'ref': os.environ.get('GITHUB_REF'),
              'run_id': os.environ.get('GITHUB_RUN_ID')},indent=2))
          PYPROV
      - name: produce demo beats (rich projects)
        run: |
          mkdir -p demo
          ./target/release/beatbox call produce_track '{"brief":"dark desi hip-hop with vocal chops, dark plucks and a sliding 808, for a gully rap verse","genre":"desi_hiphop","bpm":92,"seed":21,"max_iterations":2,"out_dir":"demo/desi"}' > demo/desi.result.json
          ./target/release/beatbox call produce_track '{"brief":"sad melodic trap with piano and gliding 808s","genre":"melodic_rap","bpm":144,"seed":7,"max_iterations":2,"out_dir":"demo/melodic"}' > demo/melodic.result.json
          for b in desi melodic; do
            p=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['files']['project'])" demo/$b.result.json)
            echo "$b project: $p"
            cp "$p" demo/$b.json
          done
          ls -la demo
      - name: screenshots via the screenshot tool
        run: |
          mkdir -p shots
          ok=0
          shoot() { # project view outname
            if ./target/release/beatbox call screenshot "{\"view\":\"$2\",\"out\":\"$GITHUB_WORKSPACE/shots/$3.png\",\"inline\":false}" --project "$1"; then
              ok=$((ok+1))
            else
              echo "::warning::screenshot $3 failed"
            fi
          }
          shoot demo/desi.json sequencer ${SHOT_TAG}_sequencer
          shoot demo/desi.json mixer ${SHOT_TAG}_mixer
          shoot demo/desi.json automation ${SHOT_TAG}_automation
          shoot demo/desi.json playlist ${SHOT_TAG}_playlist
          shoot demo/desi.json browser ${SHOT_TAG}_browser
          shoot demo/melodic.json sequencer ${SHOT_TAG}_sequencer_melodic
          shoot demo/melodic.json mixer ${SHOT_TAG}_mixer_melodic
          shoot demo/melodic.json automation ${SHOT_TAG}_automation_melodic
          shoot demo/melodic.json playlist ${SHOT_TAG}_playlist_melodic
          shoot demo/melodic.json browser ${SHOT_TAG}_browser_melodic
          ls -la shots
          [ "$ok" -eq 10 ]
          for suffix in sequencer mixer automation playlist browser; do
            test -s "shots/${SHOT_TAG}_${suffix}.png"
            test -s "shots/${SHOT_TAG}_${suffix}_melodic.png"
          done
      - name: tiny authored audio project (no additional producer run)
        run: |
          mkdir -p shots/native-fixture
          python3 - <<'PYFIX'
          import math, struct, wave
          from pathlib import Path
          path = Path('shots/native-fixture/impulses.wav')
          samples = [0.025*math.sin(math.tau*220*i/44100) for i in range(4*44100)]
          for j in range(32):
              samples[round((0.10+0.11*j)*44100)] += 0.7
          with wave.open(str(path),'wb') as f:
              f.setparams((2,2,44100,0,'NONE','not compressed'))
              f.writeframes(b''.join(struct.pack('<hh',round(x*32767),round(x*32767)) for x in samples))
          PYFIX
          project="$GITHUB_WORKSPACE/shots/native-fixture/project.json"
          call() { ./target/release/beatbox call "$1" "$2" --project "$project" >> shots/fixture-actions.log 2>&1; }
          call new_project '{"name":"Authored diagnostic impulses, not a music quality oracle","bpm":240}'
          call remove_effect '{"track":"master","index":0}'
          call remove_effect '{"track":"master","index":0}'
          call import_sample "{\"path\":\"$GITHUB_WORKSPACE/shots/native-fixture/impulses.wav\",\"name\":\"impulses\",\"license\":\"CC0\",\"source\":\"deterministic authored CI signal\"}"
          call add_track '{"name":"Diagnostic signal","preset":"pad","volume_db":0}'
          call add_audio_clip '{"track":"Diagnostic signal","sample":"impulses","start_beat":0,"length_s":4}'
          sha256sum shots/native-fixture/* > shots/fixture-sha256.txt
      - name: tiny authored master-caption projects (existing JSON tools only)
        run: |
          python3 - <<'PYCAPTIONFIX'
          import hashlib, json, os, subprocess
          from pathlib import Path
          root = Path.cwd()
          folder = root/'shots/master-caption'
          folder.mkdir(parents=True, exist_ok=True)
          binary = root/'target/release/beatbox'
          chains = {'chain':['compressor','gain','limiter'], 'empty':[],
                    'long':['parametric_eq','compressor','gain','limiter']*12}
          inputs = {}
          for name, chain in chains.items():
              inputs[name] = [
                  ['new_project', {'name':f'Authored MASTER caption {name}', 'bpm':120,
                                   'patterns':[{'name':'A','bars':1}]}],
                  ['remove_effect', {'track':'master','index':0}],
                  ['remove_effect', {'track':'master','index':0}],
                  ['add_track', {'name':'Caption tone', 'volume_db':-18,
                                 'instrument':{'type':'synth','osc1':'sine','osc2':'sine',
                                               'osc_mix':0.0,'unison':1,'noise_level':0.0}}],
                  ['add_notes', {'track':'Caption tone','pattern':'A',
                                 'notes':[{'pitch':60,'start':0,'len':16,'vel':0.4}]}],
              ] + [['add_effect', {'track':'master','type':effect}] for effect in chain]
          # Retain exact authored inputs. Project JSON is written only by the
          # existing tools, never patched to manufacture a screenshot state.
          (folder/'fixture-inputs.json').write_text(json.dumps(inputs,indent=2))
          env=os.environ.copy()
          env['BEATBOX_NO_LISTEN']='1'
          with (folder/'fixture-actions.log').open('wb') as log:
              for name, actions in inputs.items():
                  project=folder/(name+'.json')
                  project.unlink(missing_ok=True)
                  for tool, args in actions:
                      command=[str(binary),'call',tool,json.dumps(args),'--project',str(project)]
                      log.write((json.dumps(command)+'\n').encode()); log.flush()
                      run=subprocess.run(command,env=env,stdout=log,stderr=subprocess.STDOUT,timeout=60)
                      assert run.returncode==0, f'caption fixture tool failed: {name} {tool}'
                  doc=json.loads(project.read_text())
                  assert [e['type'] for e in doc['master_effects']]==chains[name], 'authored chain order changed'
                  assert len(doc['tracks'])==1 and doc['patterns'][0]['bars']==1
          hashes={p.name:hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in [folder/'fixture-inputs.json',folder/'fixture-actions.log']
                           +[folder/(name+'.json') for name in chains]}
          (folder/'fixture-sha256.json').write_text(json.dumps(hashes,indent=2))
          PYCAPTIONFIX
      - name: real native audio-check scenarios and exact manifest
        run: |
          python3 - <<'PYNATIVE'
          import hashlib, json, os, shutil, struct, subprocess, wave, zlib
          from pathlib import Path
          root = Path.cwd()
          shots = root/'shots'
          binary = root/'target/release/beatbox'
          project = shots/'native-fixture/project.json'
          fixture = shots/'native-fixture/impulses.wav'
          digest = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          fixture_hashes = {str(p.relative_to(root)):digest(p) for p in (project, fixture)}
          scenarios = ['populated','interior','invalid-range','retry','prepared','stale','long']
          cases = [(s,w,h,1) for s in scenarios for w,h in [(1100,700),(1480,920)]]
          cases += [(s,w,h,2) for s in ['populated','long'] for w,h in [(1100,700),(1480,920)]]
          expected = [f'audio_{s}_{w}x{h}_{scale}x' for s,w,h,scale in cases]
          manifest = {'schema':1,'expected':expected,'fixture_sha256':fixture_hashes,
                      'cases':[], 'missing':[], 'pending':'not attempted; no artificial worker delay',
                      'external_mcp_proof':False, 'human_inspection':'outstanding'}
          def save():
              (shots/'native-results-manifest.json').write_text(json.dumps(manifest,indent=2))
          save()
          def png_stream(path):
              # Decode RGBA8 pixels, not only IHDR. Visual inspection is separate.
              data=path.read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n'
              pos=8; payload=bytearray(); dims=None; ended=False
              while pos<len(data):
                  n=struct.unpack('>I',data[pos:pos+4])[0]
                  kind=data[pos+4:pos+8]; chunk=data[pos+8:pos+8+n]
                  crc=struct.unpack('>I',data[pos+8+n:pos+12+n])[0]
                  assert zlib.crc32(kind+chunk)&0xffffffff == crc
                  if kind==b'IHDR':
                      w,h,depth,color,compression,filtering,interlace=struct.unpack('>IIBBBBB',chunk)
                      assert (depth,color,compression,filtering,interlace)==(8,6,0,0,0)
                      dims=(w,h)
                  if kind==b'IDAT': payload.extend(chunk)
                  if kind==b'IEND': ended=True
                  pos += n+12
              assert ended and pos==len(data) and dims
              w,h=dims; raw=zlib.decompress(payload); stride=w*4+1
              assert len(raw)==stride*h and all(raw[y*stride]<=4 for y in range(h))
              pixels=hashlib.sha256(); previous=bytearray(w*4)
              for y in range(h):
                  mode=raw[y*stride]; row=bytearray(raw[y*stride+1:(y+1)*stride])
                  if mode==1:
                      for x in range(4,len(row)): row[x]=(row[x]+row[x-4])&255
                  elif mode==2:
                      row=bytearray((a+b)&255 for a,b in zip(row,previous))
                  elif mode in (3,4):
                      for x in range(len(row)):
                          left=row[x-4] if x>=4 else 0
                          above=previous[x]; corner=previous[x-4] if x>=4 else 0
                          if mode==3: predictor=(left+above)//2
                          else:
                              estimate=left+above-corner
                              da,db,dc=abs(estimate-left),abs(estimate-above),abs(estimate-corner)
                              predictor=left if da<=db and da<=dc else above if db<=dc else corner
                          row[x]=(row[x]+predictor)&255
                  pixels.update(row); previous=row
              return dims,pixels.hexdigest()
          # The original ten ordinary screenshots remain mandatory. Decode
          # them with the same verifier, not just a nonzero-byte existence test.
          ordinary=[]
          for suffix in ['sequencer','mixer','automation','playlist','browser']:
              for variant in ['', '_melodic']:
                  path=shots/(os.environ['SHOT_TAG']+'_'+suffix+variant+'.png')
                  dimensions,pixels=png_stream(path)
                  assert dimensions==(1480,920), f'ordinary screenshot dimensions: {path}'
                  ordinary.append({'file':str(path.relative_to(shots)), 'pixels':list(dimensions),
                                   'png_sha256':digest(path),'decoded_rgba_sha256':pixels,
                                   'status':'captured_uninspected'})
          assert len(ordinary)==10
          failures=[]
          for scenario,w,h,scale in cases:
              name=f'audio_{scenario}_{w}x{h}_{scale}x'
              png=shots/(name+'.png'); result=png.with_suffix('.json'); log=png.with_suffix('.log')
              for path in (png,result): path.unlink(missing_ok=True)
              env=os.environ.copy()
              env.update(BEATBOX_AUDIO_SCENARIO=scenario,BEATBOX_AUDIO_SCALE=str(scale),BEATBOX_NO_LISTEN='1')
              env.pop('BEATBOX_NARROW_SHOT',None)
              if w==1100: env['BEATBOX_NARROW_SHOT']='1'
              command=['xvfb-run','-a','-s',f'-screen 0 {w*scale}x{h*scale}x24',
                       'timeout','110s',str(binary),'call','screenshot',
                       json.dumps({'view':'mixer','out':str(png),'inline':False}),'--project',str(project)]
              row={'name':name,'command':command,'scenario':scenario,'scale':scale,
                   'logical_size':[w,h],'expected_pixels':[w*scale,h*scale]}
              try:
                  with log.open('wb') as f:
                      run=subprocess.run(command,env=env,stdout=f,stderr=subprocess.STDOUT,timeout=120)
                  row['exit_code']=run.returncode
                  assert run.returncode==0, 'capture process failed'
                  assert png.is_file() and result.is_file(), 'required PNG or native result missing'
                  dimensions,pixel_hash=png_stream(png)
                  assert dimensions==(w*scale,h*scale), 'unexpected pixel dimensions'
                  row['decoded_rgba_sha256']=pixel_hash
                  doc=json.loads(result.read_text())
                  assert doc['scenario']==scenario and doc['scale']==scale
                  assert doc['viewport_pixels']==[w*scale,h*scale]
                  assert abs(doc['pixels_per_point']-scale)<0.01
                  assert all(abs(a-b)<1.1 for a,b in zip(doc['logical_viewport'],[w,h]))
                  assert doc['build_sha']==(shots/'build-sha.txt').read_text().strip()
                  assert doc['autoplay'] is False and doc['external_mcp_proof'] is False
                  assert doc['result']['worker_pending'] is False
                  assert doc['geometry']['terminal_visible'] is True
                  assert any(a['action']=='request_check' for a in doc['actions'])
                  if scenario=='retry': assert any(a['action']=='invalid_range_error' for a in doc['actions'])
                  if scenario=='interior': assert doc['result']['report']['window_bounds']['source_end_checked'] is False
                  if scenario=='invalid-range':
                      assert 'artifact window starts outside the available source' in doc['result']['error']
                      assert doc['result']['report'] is None
                  else: assert doc['result']['report']['events']
                  if scenario=='long': assert len(doc['result']['report']['events'])>=21
                  if scenario=='prepared': assert doc['result']['prepared'] and doc['result']['play_widget_enabled'] is True
                  if scenario=='stale':
                      assert doc['result']['stale'] is True and doc['result']['play_widget_enabled'] is False
                      assert any(a['action']=='same_shared_engine_call_from_not_external_mcp' for a in doc['actions'])
                  # Preserve genuine preview outputs in the existing upload directory.
                  previews=[doc['result'].get('prepared')]
                  previews += [a['result'].get('prepared') for a in doc['actions'] if isinstance(a['result'],dict)]
                  row['excerpts']=[]
                  for preview in previews:
                      if not preview: continue
                      source=Path(preview['path']).resolve()
                      assert source.is_relative_to((root/'renders').resolve()) and source.is_file()
                      dest=shots/'excerpts'/source.name; dest.parent.mkdir(exist_ok=True)
                      shutil.copyfile(source,dest)
                      with wave.open(str(dest)) as wav:
                          frames,rate=wav.getnframes(),wav.getframerate()
                          assert frames>0 and rate==44100
                          assert abs(frames/rate-preview['decoded_seconds'])<1/rate
                      row['excerpts'].append({'file':str(dest.relative_to(shots)),'sha256':digest(dest),'frames':frames,'rate':rate})
                  row.update(status='captured_uninspected',png_sha256=digest(png),result_sha256=digest(result))
              except Exception as error:
                  row.update(status='missing_or_invalid',error=str(error))
                  manifest['missing'].append(name); failures.append(name)
              manifest['cases'].append(row); save()
          # Ordinary screenshot mode has NO NativeCapture scale adapter.
          # Do not use BEATBOX_AUDIO_SCALE here or claim these prove 2x captions.
          folder=shots/'master-caption'
          fixture_digests=json.loads((folder/'fixture-sha256.json').read_text())
          def check_caption_fixtures():
              assert fixture_digests=={name:digest(folder/name) for name in fixture_digests}, 'caption fixture inputs changed'
          check_caption_fixtures()
          caption_cases=[('chain',1480,920),('chain',1100,700),('empty',1100,700),
                         ('long',1100,700),('long',1480,920)]
          caption_expected=[f'master_{name}_{w}x{h}_1x.png' for name,w,h in caption_cases]
          caption_manifest={'schema':1,'expected':caption_expected,'cases':[], 'missing':[],
                            'fixture_sha256':fixture_digests,
                            'checkout_sha':(shots/'build-sha.txt').read_text().strip(),
                            'binary_sha256':digest(binary),
                            'rustc_sha256':digest(shots/'rustc.txt'),
                            'checkout_provenance_sha256':digest(shots/'checkout.json'),
                            'binary_sha256_file':'../binary-sha256.txt','rustc_file':'../rustc.txt',
                            'scale_contract':'ordinary native screenshots at 1x only',
                            'mix_analysis':'collapsed by ordinary fresh screenshot state; visual inspection outstanding',
                            'native_2x_caption':'UNRUN and unsupported by ordinary screenshot adapter; requires separate authority',
                            'geometry_tests_2x':'authored; not runtime native proof',
                            'autoplay':False,'external_mcp_proof':False,'human_inspection':'outstanding'}
          def save_caption():
              (folder/'manifest.json').write_text(json.dumps(caption_manifest,indent=2))
          save_caption()
          assert caption_manifest['binary_sha256']==(shots/'binary-sha256.txt').read_text().split()[0], 'capture binary differs from build provenance'
          for (name,w,h),filename in zip(caption_cases,caption_expected):
              png=folder/filename; log=png.with_suffix('.log')
              source=folder/(name+'.json')
              chain=[effect['type'] for effect in json.loads(source.read_text())['master_effects']]
              png.unlink(missing_ok=True)
              env=os.environ.copy()
              env['BEATBOX_NO_LISTEN']='1'
              for key in ['BEATBOX_AUDIO_SCENARIO','BEATBOX_AUDIO_SCALE','BEATBOX_NARROW_SHOT']:
                  env.pop(key,None)
              if w==1100: env['BEATBOX_NARROW_SHOT']='1'
              command=['xvfb-run','-a','-s',f'-screen 0 {w}x{h}x24','timeout','110s',
                       str(binary),'call','screenshot',
                       json.dumps({'view':'mixer','out':str(png),'inline':False}),'--project',str(source)]
              row={'file':filename,'command':command,'fixture':source.name,
                   'fixture_sha256':digest(source),'chain_order':chain,
                   'expected_pixels':[w,h],'scale':1,
                   'environment':{'BEATBOX_NO_LISTEN':'1','BEATBOX_NARROW_SHOT':env.get('BEATBOX_NARROW_SHOT'),
                                  'BEATBOX_AUDIO_SCENARIO':None,'BEATBOX_AUDIO_SCALE':None}}
              try:
                  with log.open('wb') as f:
                      run=subprocess.run(command,env=env,stdout=f,stderr=subprocess.STDOUT,timeout=120)
                  row['exit_code']=run.returncode
                  assert run.returncode==0, 'caption capture process failed'
                  assert png.is_file() and png.stat().st_size>0, 'exact caption PNG missing'
                  dimensions,pixels=png_stream(png)
                  assert dimensions==(w,h), 'caption pixel dimensions mismatch'
                  row.update(status='captured_uninspected',png_sha256=digest(png),
                             decoded_rgba_sha256=pixels,log_sha256=digest(log),pixels=list(dimensions))
              except Exception as error:
                  row.update(status='missing_or_invalid',error=str(error))
                  caption_manifest['missing'].append(filename)
              caption_manifest['cases'].append(row); save_caption()
          check_caption_fixtures()
          assert digest(binary)==caption_manifest['binary_sha256'], 'capture binary changed'
          caption_required=[folder/file for file in caption_expected]
          caption_required += [folder/file.replace('.png','.log') for file in caption_expected]
          caption_required += [folder/file for file in ['chain.json','empty.json','long.json',
                               'fixture-inputs.json','fixture-actions.log','fixture-sha256.json','manifest.json']]
          assert all(path.is_file() and path.stat().st_size>0 for path in caption_required), 'caption exact required files incomplete'
          assert len(caption_manifest['cases'])==5 and not caption_manifest['missing'], 'all five caption cases are required'
          assert all(row['status']=='captured_uninspected' for row in caption_manifest['cases'])
          def arrangement_appearance():
              # Arrangement appearance only, reusing this verifier and capture tool.
              folder=shots/'arrangement'
              folder.mkdir(exist_ok=True)
              action_log=folder/'fixture-actions.log'
              inputs=[]
              fixture_env=os.environ.copy()
              fixture_env['BEATBOX_NO_LISTEN']='1'
              for key in ['BEATBOX_AUDIO_SCENARIO','BEATBOX_AUDIO_SCALE','BEATBOX_ARRANGEMENT_CAPTURE',
                          'BEATBOX_ARRANGEMENT_CLIP_ID','BEATBOX_ARRANGEMENT_ACTION_HASH']:
                  fixture_env.pop(key,None)
              with action_log.open('wb') as log:
                  def call(project,tool,args):
                      inputs.append({'project':project.name,'tool':tool,'args':args})
                      command=[str(binary),'call',tool,json.dumps(args),'--project',str(project)]
                      log.write((json.dumps(command)+'\n').encode()); log.flush()
                      run=subprocess.run(command,env=fixture_env,capture_output=True,timeout=60)
                      log.write(run.stdout+run.stderr); log.flush()
                      assert run.returncode==0, f'arrangement fixture failed: {tool}'
                      return json.loads(run.stdout)
                  def fresh(name,bpm=120):
                      project=folder/(name+'.json'); project.unlink(missing_ok=True)
                      call(project,'new_project',{'name':'Authored arrangement '+name,'bpm':bpm,
                           'patterns':[{'name':'A','bars':1},{'name':'B','bars':1}]})
                      for _ in range(2): call(project,'remove_effect',{'track':'master','index':0})
                      return project
                  def tone(project):
                      call(project,'add_track',{'name':'Tone','volume_db':-24,
                           'instrument':{'type':'synth','osc1':'sine','osc2':'sine','osc_mix':0.0,'unison':1,'noise_level':0.0}})
                      for pattern,pitch in [('A',60),('B',67)]:
                          call(project,'add_notes',{'track':'Tone','pattern':pattern,
                               'notes':[{'pitch':pitch,'start':0,'len':4,'vel':0.4}]})
                  shared=fresh('shared'); tone(shared)
                  for pattern,start,lane in [('A',0,0),('A',3,1),('B',6,2)]:
                      call(shared,'place_pattern',{'pattern':pattern,'start_bar':start,'bars':2,'lane':lane})
                  original=json.loads(shared.read_text())
                  selected=original['playlist'][0]
                  selected_id=selected['id']
                  assert selected_id and sum(c['pattern']==selected['pattern'] for c in original['playlist'])==2
                  assert len({c['id'] for c in original['playlist']})==3
                  independent=folder/'independent.json'
                  shutil.copyfile(shared,independent)
                  result=call(independent,'playlist_clip',{'action':'make_unique','id':selected_id})
                  unique=json.loads(independent.read_text())
                  copied=next(c for c in unique['playlist'] if c['id']==selected_id)
                  assert copied['pattern']==result['new_pattern'] and copied['pattern']!=selected['pattern']
                  assert {k:v for k,v in copied.items() if k!='pattern'}=={k:v for k,v in selected.items() if k!='pattern'}
                  assert unique['playlist'][1:]==original['playlist'][1:]
                  assert sum(c['pattern']==copied['pattern'] for c in unique['playlist'])==1
                  source=lambda doc,name: next(p for p in doc['patterns'] if p['name']==name)
                  original_pattern=source(original,selected['pattern'])
                  copied_pattern=source(unique,copied['pattern'])
                  # Only authored note identity changes; retain every other payload key.
                  def note_payloads(clips):
                      return {track:[{k:v for k,v in note.items() if k!='id'} for note in notes]
                              for track,notes in clips.items()}
                  assert note_payloads(copied_pattern['clips'])==note_payloads(original_pattern['clips'])
                  assert {k:v for k,v in copied_pattern.items() if k not in ('id','name','clips')}=={
                      k:v for k,v in original_pattern.items() if k not in ('id','name','clips')}
                  assert source(unique,selected['pattern'])==original_pattern
                  assert unique['tracks']==original['tracks']
                  pattern_id=copied_pattern.get('id')
                  assert isinstance(pattern_id,str) and pattern_id.strip()
                  assert pattern_id not in {p.get('id') for p in original['patterns']}
