          def feel_appearance():
              # Fixed appearance inputs only, not a native-input acceptance driver.
              # Private Feel-only supervision; other forty launch paths are unchanged.
              feel_focus_helper="# Private Feel environment probe, not a native-input acceptance driver.\nimport ctypes as C\nimport hashlib, json, os, pathlib, signal, stat, subprocess, sys, time\n\nclass FocusFailure(Exception): pass\n\ndef require(ok, message):\n    if not ok: raise FocusFailure(message)\n\ndef bounded_read(path, cap):\n    with open(path, 'rb') as f: data=f.read(cap+1)\n    require(len(data)<=cap, 'proc/file cap')\n    return data\n\ndef proc_stat(data):\n    # comm may contain spaces and parentheses. Fields after final ')' start at state.\n    end=data.rfind(b')')\n    require(end>0 and data[end+1:end+2]==b' ', 'stat layout')\n    fields=data[end+2:].split()\n    require(len(fields)>=20, 'short stat')\n    return {'state':fields[0].decode('ascii'), 'ppid':int(fields[1]),\n            'pgid':int(fields[2]), 'sid':int(fields[3]), 'start':int(fields[19])}\n\ndef process(pid):\n    root=pathlib.Path('/proc')/str(pid)\n    info=proc_stat(bounded_read(root/'stat',4096))\n    require(info['state'] not in ('Z','X','x'), 'owner dead')\n    exe=(root/'exe').stat()\n    raw=bounded_read(root/'cmdline',8192)\n    require(raw.endswith(b'\\0'), 'cmdline termination')\n    argv=[os.fsdecode(v) for v in raw[:-1].split(b'\\0')]\n    require(len(argv)<=16 and all(len(a)<=4096 for a in argv), 'argv cap')\n    same_process(info,proc_stat(bounded_read(root/'stat',4096)))\n    info.update(pid=pid,exe=[exe.st_dev,exe.st_ino],argv=argv)\n    return info\n\ndef same_process(before, after):\n    require({k:v for k,v in before.items() if k!='state'}=={k:v for k,v in after.items() if k!='state'}, 'process identity drift')\n\ndef environment(pid, expected):\n    raw=bounded_read(f'/proc/{pid}/environ',65536)\n    require(raw.endswith(b'\\0'), 'environ termination')\n    # Never serialize the complete environment or auth values.\n    pairs=[v.split(b'=',1) for v in raw[:-1].split(b'\\0')]\n    keys={os.fsencode(k):os.fsencode(v) for k,v in expected.items()}\n    for key,value in keys.items():\n        found=[v for k,v in pairs if k==key]\n        require(found==[value], 'allowlisted environment mismatch')\n    for key in (b'WAYLAND_DISPLAY',b'WAYLAND_SOCKET'):\n        require(not any(k==key and v for k,v in pairs), 'Wayland endpoint')\n\ndef typed_path(path, caller_pid):\n    p=pathlib.Path(path)\n    require(p.is_absolute() and p.name==f'beatbox_shot_{caller_pid}.json', 'typed launcher pathname')\n    s=p.lstat()\n    require(stat.S_ISREG(s.st_mode) and s.st_uid==os.getuid(), 'typed launcher ownership')\n    fd=os.open(p,os.O_RDONLY|os.O_NOFOLLOW)\n    with os.fdopen(fd,'rb') as f:\n        actual=os.fstat(f.fileno())\n        require((actual.st_dev,actual.st_ino,actual.st_uid)==(s.st_dev,s.st_ino,s.st_uid)\n                and stat.S_ISREG(actual.st_mode),'typed launcher file drift')\n        data=f.read(1048577)\n        require(len(data)<=1048576,'typed launcher cap')\n    require(isinstance(json.loads(data),dict), 'typed launcher JSON')\n    return {'path':str(p),'device':s.st_dev,'inode':s.st_ino,'sha256':hashlib.sha256(data).hexdigest()}\n\nclass XWindowAttributes(C.Structure):\n    _fields_=[('x',C.c_int),('y',C.c_int),('width',C.c_int),('height',C.c_int),\n      ('border_width',C.c_int),('depth',C.c_int),('visual',C.c_void_p),('root',C.c_ulong),\n      ('class_',C.c_int),('bit_gravity',C.c_int),('win_gravity',C.c_int),('backing_store',C.c_int),\n      ('backing_planes',C.c_ulong),('backing_pixel',C.c_ulong),('save_under',C.c_int),\n      ('colormap',C.c_ulong),('map_installed',C.c_int),('map_state',C.c_int),\n      ('all_event_masks',C.c_long),('your_event_mask',C.c_long),('do_not_propagate_mask',C.c_long),\n      ('override_redirect',C.c_int),('screen',C.c_void_p)]\n\nclass XErrorEvent(C.Structure):\n    _fields_=[('type',C.c_int),('display',C.c_void_p),('resourceid',C.c_ulong),\n              ('serial',C.c_ulong),('error_code',C.c_ubyte),('request_code',C.c_ubyte),('minor_code',C.c_ubyte)]\n\ndef validate_abi():\n    layout={'pointer':C.sizeof(C.c_void_p),'long':C.sizeof(C.c_long),\n            'ulong':C.sizeof(C.c_ulong),'int':C.sizeof(C.c_int),\n            'attributes':C.sizeof(XWindowAttributes),'error_event':C.sizeof(XErrorEvent),\n            'screen_offset':XWindowAttributes.screen.offset,'error_code_offset':XErrorEvent.error_code.offset}\n    require(layout=={'pointer':8,'long':8,'ulong':8,'int':4,'attributes':136,'error_event':40,\n                     'screen_offset':128,'error_code_offset':32},'unsupported Xlib ABI')\n    return layout\n\nErrorHandler=C.CFUNCTYPE(C.c_int,C.c_void_p,C.POINTER(XErrorEvent))\n\ndef property_value(actual, fmt, count, after, pointer, expected, wanted_format, cap):\n    # Called while Xlib allocation is still owned, before XFree.\n    require(after==0 and count<=cap, 'property truncation/cap')\n    if actual==0:\n        require(fmt==0 and count==0, 'malformed missing property')\n        return None\n    require(actual==expected and fmt==wanted_format and bool(pointer), 'property type/format')\n    if fmt==32:\n        require(count==1, 'PID item count')\n        value=C.cast(pointer,C.POINTER(C.c_ulong))[0]\n        require(0<value<=0xffffffff, 'PID native-long range')\n        return int(value)\n    return C.string_at(pointer,count)\n\nclass X11:\n    def __init__(self):\n        self.lib=C.CDLL('libX11.so.6'); self.display=None; self.old=None\n        self.errors=[]; self.overflow=False; self.callback_failed=False\n        P=C.c_void_p; U=C.c_ulong; I=C.c_int; UP=C.POINTER(U)\n        specs={\n          'XOpenDisplay':([C.c_char_p],P),'XCloseDisplay':([P],I),\n          'XDefaultRootWindow':([P],U),'XQueryTree':([P,U,UP,UP,C.POINTER(UP),C.POINTER(C.c_uint)],I),\n          'XInternAtom':([P,C.c_char_p,I],U),\n          'XGetWindowProperty':([P,U,U,C.c_long,C.c_long,I,U,UP,C.POINTER(I),UP,UP,C.POINTER(C.POINTER(C.c_ubyte))],I),\n          'XGetWindowAttributes':([P,U,C.POINTER(XWindowAttributes)],I),\n          'XSetInputFocus':([P,U,I,U],I),'XGetInputFocus':([P,UP,C.POINTER(I)],I),\n          'XSync':([P,I],I),'XFree':([P],I),'XSetErrorHandler':([P],P)}\n        for name,(args,result) in specs.items():\n            f=getattr(self.lib,name); f.argtypes=args; f.restype=result\n        def handler(display,event):\n            try:\n                e=event.contents\n                if len(self.errors)<16:\n                    self.errors.append([int(e.error_code),int(e.request_code),int(e.minor_code),int(e.resourceid)])\n                else: self.overflow=True\n            except BaseException: self.callback_failed=True\n            return 0\n        self.callback=ErrorHandler(handler) # keep alive through close and restoration\n        self.old=self.lib.XSetErrorHandler(C.cast(self.callback,P))\n        self.display=self.lib.XOpenDisplay(None)\n        require(self.display, 'XOpenDisplay failed')\n        self.root=int(self.lib.XDefaultRootWindow(self.display)); require(self.root!=0,'root missing')\n        self.atoms={name:int(self.lib.XInternAtom(self.display,name.encode(),1))\n                    for name in ('_NET_WM_PID','_NET_WM_NAME','UTF8_STRING')}\n        self.sync()\n    def sync(self):\n        self.lib.XSync(self.display,0)\n        require(not self.errors and not self.overflow and not self.callback_failed, 'X protocol error')\n    def close(self):\n        try:\n            if self.display:\n                self.lib.XCloseDisplay(self.display); self.display=None\n                require(not self.errors and not self.overflow and not self.callback_failed,'X close error')\n        finally:\n            if self.callback is not None:\n                self.lib.XSetErrorHandler(self.old); self.callback=None\n    def prop(self,window,name,expected,fmt,cap):\n        if not self.atoms[name]: return None\n        pointer=C.POINTER(C.c_ubyte)(); actual=C.c_ulong(); form=C.c_int(); count=C.c_ulong(); after=C.c_ulong()\n        try:\n            result=self.lib.XGetWindowProperty(self.display,window,self.atoms[name],0,(cap+3)//4,\n                        0,0,C.byref(actual),C.byref(form),C.byref(count),C.byref(after),C.byref(pointer))\n            self.sync(); require(result==0,'property status')\n            return property_value(actual.value,form.value,count.value,after.value,pointer,expected,fmt,cap)\n        finally:\n            if pointer: self.lib.XFree(pointer)\n    def attrs(self,window):\n        a=XWindowAttributes()\n        result=self.lib.XGetWindowAttributes(self.display,window,C.byref(a))\n        self.sync(); require(result!=0,'attributes status')\n        return {'root':int(a.root),'class':a.class_,'map_state':a.map_state,\n                'geometry':[a.x,a.y,a.width,a.height,a.border_width,a.depth],\n                'override_redirect':bool(a.override_redirect)}\n    def tree(self):\n        result=[]; todo=[(self.root,0)]; seen={self.root}\n        while todo:\n            window,depth=todo.pop()\n            children=C.POINTER(C.c_ulong)(); root=C.c_ulong(); parent=C.c_ulong(); count=C.c_uint()\n            try:\n                ok=self.lib.XQueryTree(self.display,window,C.byref(root),C.byref(parent),C.byref(children),C.byref(count))\n                self.sync(); require(ok!=0 and root.value==self.root,'tree status/root')\n                require(count.value<=256-len(seen),'tree node cap')\n                require(not count.value or depth<8,'tree depth cap')\n                require(not count.value or bool(children),'null children')\n                for i in range(count.value):\n                    child=int(children[i]); require(child not in seen,'tree cycle')\n                    seen.add(child); result.append((child,window)); todo.append((child,depth+1))\n            finally:\n                if children: self.lib.XFree(children)\n        return result\n    def focus(self):\n        window=C.c_ulong(); revert=C.c_int()\n        self.lib.XGetInputFocus(self.display,C.byref(window),C.byref(revert)); self.sync()\n        return [int(window.value),int(revert.value)]\n\ndef choose(candidates):\n    require(len(candidates)<=1,'ambiguous clients')\n    return candidates[0] if candidates else None\n\ndef eligible(attrs,root,w,h):\n    return (attrs['root']==root and attrs['class']==1 and attrs['map_state']==2\n            and attrs['geometry'][2:4]==[w,h] and w>0 and h>0)\n\ndef focus_once(x,selected,revalidate,evidence=None):\n    revalidate()\n    before=x.focus(); issued=before[0]!=selected\n    if evidence is not None: evidence.update(focus_before=before,set_issued=issued)\n    if issued: x.lib.XSetInputFocus(x.display,selected,2,0)\n    x.sync(); after=x.focus()\n    if evidence is not None: evidence['focus_after']=after\n    require(after[0]==selected,'post-focus mismatch')\n    revalidate()\n    return before,after,issued\n\ndef run():\n    proof_path=pathlib.Path(sys.argv[1]); w,h=map(int,sys.argv[2:4]); command=sys.argv[4:]\n    started=time.monotonic(); stopped=[0]; caller=None; x=None; outcome=1\n    saved={s:signal.getsignal(s) for s in (signal.SIGTERM,signal.SIGINT,signal.SIGHUP)}\n    def note(sig,frame):\n        if not stopped[0]: stopped[0]=sig\n    doc={'schema':1,'diagnostic_only':True,'acceptance':False,'native_input_acceptance':'UNRUN',\n         'status':'failed','helper_sha256':hashlib.sha256(bounded_read('/proc/self/cmdline',131072).split(b'\\0')[2]).hexdigest(),\n         'abi':None,'display':None,'root':None,'library':'libX11.so.6','group':None,'helper':None,'caller':None,\n         'studio':None,'launcher':None,'selector':None,'target':None,'title':None,'attributes':None,\n         'observations':0,'candidate_count':0,'focus_before':None,'focus_after':None,'set_issued':False,\n         'focus_us':None,'caller_exit':None,'x_errors':[],'error':None,'elapsed_us':None,\n         'cleanup_owner':'parent anchored xvfb group; direct caller reaped only on ordinary exit'}\n    try:\n        for sig in saved: signal.signal(sig,note)\n        require(not os.environ.get('WAYLAND_DISPLAY') and not