name: screenshots
# Fresh GUI screenshots of Beatbox Studio with a real produced beat loaded.
# Uses the repo's own `screenshot` tool (tools_parity.rs), which spawns
# `beatbox studio --screenshot` under xvfb-run when there is no display.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or SHA to build and capture
        required: false
        default: main
env:
  CARGO_TERM_COLOR: always
  SHOT_TAG: s9b
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: system deps (GUI build + headless X)
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config libxkbcommon-dev libwayland-dev libx11-dev \
            xvfb xauth libgl1-mesa-dri libegl1 libxkbcommon-x11-0 libxcursor1 libxrandr2 libxi6 python3
      - name: prepare screenshot state (capture only)
        run: |
          python3 - <<'PYSETUP'
          from pathlib import Path
          p = Path('src/gui/mod.rs')
          s = p.read_text()
          old = 'self.player.play();\n            }\n            let ready = self'
          new = 'self.player.play();\n                if self.view == 5 {\n                    if let Some(s) = p.samples.first() {\n                        self.browser.edit = browser_view::SampleEdit {\n                            sample: s.name.clone(), end: s.duration,\n                            lo: 2000.0, hi: 8000.0, gain: -60.0, fade_ms: 10.0,\n                            ..Default::default()\n                        };\n                    }\n                }\n                if self.view == 1 {\n                    let v = self.engine.lock().unwrap().call_from("stereo_image", &json!({}), "you").expect("stereo readout");\n                    self.mix_readout = Some(views::format_readout("STEREO", "stereo_image", &v));\n                    if std::env::var_os("PAGE_TWO").is_some() {\n                        for t in &p.tracks {\n                            ctx.data_mut(|d| {\n                                d.insert_temp(egui::Id::new(("insert_page", t.name.as_str())), 1usize);\n                                d.insert_temp(egui::Id::new(("send_page", t.name.as_str())), 1usize);\n                            });\n                        }\n                    }\n                }\n            }\n            let ready = self'
          assert old in s
          p.write_text(s.replace(old, new, 1))
          p = Path('src/gui/views.rs')
          s = p.read_text()
          assert 'fn format_readout(' in s
          p.write_text(s.replace('fn format_readout(', 'pub(super) fn format_readout(', 1))
          s = p.read_text()
          old = '                .id_salt("mix_readout")'
          new = old + '\n                .vertical_scroll_offset(if std::env::var_os("REPORT_BOTTOM").is_some() { 10000.0 } else { 0.0 })'
          assert old in s
          p.write_text(s.replace(old, new, 1))
          PYSETUP
      - name: build (release, GUI feature)
        run: cargo build --release
      - name: produce demo beats (rich projects)
        run: |
          mkdir -p demo
          ./target/release/beatbox call produce_track '{"brief":"dark desi hip-hop with vocal chops, dark plucks and a sliding 808, for a gully rap verse","genre":"desi_hiphop","bpm":92,"seed":21,"max_iterations":2,"out_dir":"demo/desi"}' > demo/desi.result.json
          ./target/release/beatbox call produce_track '{"brief":"sad melodic trap with piano and gliding 808s","genre":"melodic_rap","bpm":144,"seed":7,"max_iterations":2,"out_dir":"demo/melodic"}' > demo/melodic.result.json
          for b in desi melodic; do
            p=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['files']['project'])" demo/$b.result.json)
            echo "$b project: $p"
            cp "$p" demo/$b.json
          done
          python3 - <<'PYWAV'
          import wave, math, struct
          with wave.open('demo/editor_fixture.wav', 'wb') as w:
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(44100)
              w.writeframes(b''.join(struct.pack('<h', int(8000*math.sin(2*math.pi*220*i/44100)*math.exp(-3*(i%22050)/22050))) for i in range(88200)))
          PYWAV
          ./target/release/beatbox call import_sample '{"path":"demo/editor_fixture.wav","name":"editor_fixture"}' --project demo/desi.json
          ls -la demo
      - name: screenshots via the screenshot tool
        run: |
          mkdir -p shots
          ok=0
          shoot() { # project view outname
            if ./target/release/beatbox call screenshot "{\"view\":\"$2\",\"out\":\"$GITHUB_WORKSPACE/shots/$3.png\",\"inline\":false}" --project "$1"; then
              ok=$((ok+1))
            else
              echo "::warning::screenshot $3 failed"
            fi
          }
          shoot demo/desi.json mixer evidence_mixer
          REPORT_BOTTOM=1 shoot demo/desi.json mixer evidence_mixer_bottom
          PAGE_TWO=1 shoot demo/desi.json mixer evidence_mixer_page2
          shoot demo/desi.json browser evidence_browser
          ls -la shots
          [ "$ok" -gt 0 ]
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/
          if-no-files-found: warn
