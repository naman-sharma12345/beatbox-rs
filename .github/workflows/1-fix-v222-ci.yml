name: Publish verified screenshot layout isolation
on:
  push:
    branches:
    - screenshot-routing
    paths:
    - .github/workflows/*fix-v222-ci.yml
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'naman-sharma12345/beatbox-rs' && github.actor == 'naman-sharma12345'
      && github.ref == 'refs/heads/screenshot-routing'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Apply hash-verified clean-runner regression corrections
      shell: bash
      run: "set -euo pipefail\n[ \"$(git rev-parse HEAD^)\" = b951a527720f2c76372cf4e26b3c0f0286b9f8a1\
        \ ]\n[ \"$(git rev-parse origin/main)\" = b951a527720f2c76372cf4e26b3c0f0286b9f8a1\
        \ ]\npython3 - <<'PYCODE'\nimport base64,hashlib,pathlib,gzip\nb=gzip.decompress(base64.b64decode(''))\n\
        assert hashlib.sha256(b).hexdigest()=='e5d1a57355e1d7d6e1a69cb85713ea49890b2fd01ceb308b9aac9c0fcb7a42a8'\n\
        pathlib.Path('/tmp/ci-fix.patch').write_bytes(b)\nPYCODE\ngit apply --check\
        \ /tmp/ci-fix.patch\ngit apply /tmp/ci-fix.patch\npython3 - <<'PYCODE'\nimport\
        \ pathlib,hashlib\nexpected={'src/gui/mod.rs': '21c72cd601e2077b30b3ae9932ac5b5c2678c053e349d0737735f52dd5202340',\
        \ 'src/gui/workspace.rs': '5b029bc4a91af0f03498bcc4eb4918b406c67f8082441c28f0e4cbb6a2d7fd20'}\n\
        for f,h in expected.items():\n assert hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest()==h,f\n\
        PYCODE\ngit config user.name 'github-actions[bot]'\ngit config user.email\
        \ '41898282+github-actions[bot]@users.noreply.github.com'\ngit add src tests\
        \ scripts\ngit commit -m \"Keep automated captures independent of interactive\
        \ layouts\"\ngit fetch origin screenshot-routing main\n[ \"$(git rev-parse\
        \ origin/screenshot-routing)\" = \"$GITHUB_SHA\" ]\n[ \"$(git rev-parse origin/main)\"\
        \ = b951a527720f2c76372cf4e26b3c0f0286b9f8a1 ]\ngit push origin HEAD:refs/heads/screenshot-routing\n"
