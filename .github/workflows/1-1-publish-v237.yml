name: Publish bounce file preservation
'on':
  push:
    branches:
    - bounce-guard
    paths:
    - .github/workflows/*publish-v237.yml
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'naman-sharma12345/beatbox-rs' && github.actor == 'naman-sharma12345'
      && github.ref == 'refs/heads/bounce-guard'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Apply exact locally tested sample preservation patch
      shell: bash
      run: 'set -euo pipefail

        [ "$(git rev-parse HEAD^)" = 0239366e753d5e7896e05257dac738a2c1727a6e ]

        [ "$(git rev-parse origin/main)" = 0239366e753d5e7896e05257dac738a2c1727a6e
        ]

        python3 - <<''PYCODE''

        import base64,gzip,hashlib,pathlib

        b=gzip.decompress(base64.b64decode(''''))

        assert hashlib.sha256(b).hexdigest()==''8760460a16f7bb5ca8fea53041a2bc900ee4bb087ea7969141e3bca2e97a5991''

        pathlib.Path(''/tmp/checked.patch'').write_bytes(b)

        PYCODE

        git apply --check /tmp/checked.patch

        git apply /tmp/checked.patch

        python3 - <<''PYCODE''

        import hashlib,pathlib

        expected={''src/tools_bounce.rs'': ''24eaaed19b252e64f5331f26c38b4ba730beddd9f51dd5fe9c0ae5527f7433fb'',
        ''tests/bounce_preservation.rs'': ''7e61d5470dffe8b388a38b967ddd7deb5bbf9e7adc3f07644ba010cc8e18984e''}

        for f,h in expected.items(): assert hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest()==h,f

        PYCODE

        git config user.name ''github-actions[bot]''

        git config user.email ''41898282+github-actions[bot]@users.noreply.github.com''

        git add src/tools_bounce.rs tests/bounce_preservation.rs

        git commit -m "Preserve earlier bounce files across sanitized name collisions"

        git fetch origin bounce-guard main

        [ "$(git rev-parse origin/bounce-guard)" = "$GITHUB_SHA" ]

        [ "$(git rev-parse origin/main)" = 0239366e753d5e7896e05257dac738a2c1727a6e
        ]

        git push origin HEAD:refs/heads/bounce-guard

        '
