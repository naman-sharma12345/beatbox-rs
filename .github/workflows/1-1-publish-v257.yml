name: Publish stereo tempo validation
'on':
  push:
    branches:
    - stereo-tempo
    paths:
    - .github/workflows/*publish-v257.yml
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'naman-sharma12345/beatbox-rs' && github.actor == 'naman-sharma12345'
      && github.ref == 'refs/heads/stereo-tempo'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Apply exact locally tested sample preservation patch
      shell: bash
      run: 'set -euo pipefail

        [ "$(git rev-parse HEAD^)" = c84d89e3fb307d8cdb40fd787048327dea15828e ]

        [ "$(git rev-parse origin/main)" = c84d89e3fb307d8cdb40fd787048327dea15828e
        ]

        python3 - <<''PYCODE''

        import base64,gzip,hashlib,pathlib

        b=gzip.decompress(base64.b64decode(''''))

        assert hashlib.sha256(b).hexdigest()==''8a569e8aadde71b03972a00aa376c8fd417ae2c2429acff13b0f5282010f2ac2''

        pathlib.Path(''/tmp/checked.patch'').write_bytes(b)

        PYCODE

        git apply --check /tmp/checked.patch

        git apply /tmp/checked.patch

        python3 - <<''PYCODE''

        import hashlib,pathlib

        expected={''src/audio_edit.rs'': ''b0521198eec4564520b1eb6d18a07a44cf1c22622624848a41be3c4c0b0007a2'',
        ''tests/stereo_tempo.rs'': ''f085590b0e8481af4d78f8d13419aafb85521cd1fb71b0af8f471daee5df227f''}

        for f,h in expected.items(): assert hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest()==h,f

        PYCODE

        git config user.name ''github-actions[bot]''

        git config user.email ''41898282+github-actions[bot]@users.noreply.github.com''

        git add src/audio_edit.rs tests/stereo_tempo.rs

        git commit -m "Estimate stereo tempo without mono cancellation"

        git fetch origin stereo-tempo main

        [ "$(git rev-parse origin/stereo-tempo)" = "$GITHUB_SHA" ]

        [ "$(git rev-parse origin/main)" = c84d89e3fb307d8cdb40fd787048327dea15828e
        ]

        git push origin HEAD:refs/heads/stereo-tempo

        '
