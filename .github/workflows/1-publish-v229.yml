name: Publish selectable mix translation excerpts
'on':
  push:
    branches:
    - translation-excerpt
    paths:
    - .github/workflows/*publish-v229.yml
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'naman-sharma12345/beatbox-rs' && github.actor == 'naman-sharma12345'
      && github.ref == 'refs/heads/translation-excerpt'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Apply verified translation excerpt patch
      shell: bash
      run: "set -euo pipefail\n[ \"$(git rev-parse HEAD^)\" = ef6c36fc42ac47facbffb840777593903658d737\
        \ ]\n[ \"$(git rev-parse origin/main)\" = ef6c36fc42ac47facbffb840777593903658d737\
        \ ]\npython3 - <<'PYCODE'\nimport base64,gzip,hashlib,pathlib\nb=gzip.decompress(base64.b64decode(''))\n\
        assert hashlib.sha256(b).hexdigest()=='ad3bf612b35ebb3b9c6bb6c2cc907ca314d8ee9cd86c750c0322003dc43f0dee'\n\
        pathlib.Path('/tmp/verified.patch').write_bytes(b)\nPYCODE\ngit apply --check\
        \ /tmp/verified.patch\ngit apply /tmp/verified.patch\npython3 - <<'PYCODE'\n\
        import hashlib,pathlib\nexpected={'src/gui/browser_view.rs': '74efbb730253f31e5660806ec2282d7c5cfabef7571f90da3a3b808bce65f053',\
        \ 'src/tools_chain.rs': '9676959619e80b98442a9cb0117b4119b98418812fcdd2bd08e47e97f02cdddd'}\n\
        for f,h in expected.items():\n assert hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest()==h,f\n\
        PYCODE\ngit config user.name 'github-actions[bot]'\ngit config user.email\
        \ '41898282+github-actions[bot]@users.noreply.github.com'\ngit add src/gui/browser_view.rs\
        \ src/tools_chain.rs\ngit commit -m \"Select elapsed-time mix translation\
        \ excerpts safely\"\ngit fetch origin translation-excerpt main\n[ \"$(git\
        \ rev-parse origin/translation-excerpt)\" = \"$GITHUB_SHA\" ]\n[ \"$(git rev-parse\
        \ origin/main)\" = ef6c36fc42ac47facbffb840777593903658d737 ]\ngit push origin\
        \ HEAD:refs/heads/translation-excerpt\n"
