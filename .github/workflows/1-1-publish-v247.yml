name: Publish slice note range validation
'on':
  push:
    branches:
    - slice-note-range
    paths:
    - .github/workflows/*publish-v247.yml
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'naman-sharma12345/beatbox-rs' && github.actor == 'naman-sharma12345'
      && github.ref == 'refs/heads/slice-note-range'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Apply exact locally tested sample preservation patch
      shell: bash
      run: 'set -euo pipefail

        [ "$(git rev-parse HEAD^)" = b89843c163d17059425eba1d588b1c45a6821fce ]

        [ "$(git rev-parse origin/main)" = b89843c163d17059425eba1d588b1c45a6821fce
        ]

        python3 - <<''PYCODE''

        import base64,gzip,hashlib,pathlib

        b=gzip.decompress(base64.b64decode(''''))

        assert hashlib.sha256(b).hexdigest()==''ff42188764336d5f010e069616117af8f825f2095bfdef632b4d6710bda0da8d''

        pathlib.Path(''/tmp/checked.patch'').write_bytes(b)

        PYCODE

        git apply --check /tmp/checked.patch

        git apply /tmp/checked.patch

        python3 - <<''PYCODE''

        import hashlib,pathlib

        expected={''src/tools_sound.rs'': ''211952aad698301e9b196bb003bdcab7c340a67f20e8636924784042893a0c45'',
        ''tests/slice_note_range.rs'': ''f8d4adfd73e6c0ee71a44422a10b1949accb875ff627e18c991384bd64397422''}

        for f,h in expected.items(): assert hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest()==h,f

        PYCODE

        git config user.name ''github-actions[bot]''

        git config user.email ''41898282+github-actions[bot]@users.noreply.github.com''

        git add src/tools_sound.rs tests/slice_note_range.rs

        git commit -m "Reject slice maps outside the playable note range"

        git fetch origin slice-note-range main

        [ "$(git rev-parse origin/slice-note-range)" = "$GITHUB_SHA" ]

        [ "$(git rev-parse origin/main)" = b89843c163d17059425eba1d588b1c45a6821fce
        ]

        git push origin HEAD:refs/heads/slice-note-range

        '
