name: Publish consolidated clip file preservation
'on':
  push:
    branches:
    - consolidate-guard
    paths:
    - .github/workflows/*publish-v236.yml
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'naman-sharma12345/beatbox-rs' && github.actor == 'naman-sharma12345'
      && github.ref == 'refs/heads/consolidate-guard'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Apply exact locally tested sample preservation patch
      shell: bash
      run: 'set -euo pipefail

        [ "$(git rev-parse HEAD^)" = 73a8cf4c196b51c6739e31cbc33766d4dee20419 ]

        [ "$(git rev-parse origin/main)" = 73a8cf4c196b51c6739e31cbc33766d4dee20419
        ]

        python3 - <<''PYCODE''

        import base64,gzip,hashlib,pathlib

        b=gzip.decompress(base64.b64decode(''''))

        assert hashlib.sha256(b).hexdigest()==''d6a5af26de717603e040b4949ec27eec7fb794e64147621ddfae64465c02f7b1''

        pathlib.Path(''/tmp/checked.patch'').write_bytes(b)

        PYCODE

        git apply --check /tmp/checked.patch

        git apply /tmp/checked.patch

        python3 - <<''PYCODE''

        import hashlib,pathlib

        expected={''src/tools_timeline.rs'': ''1ed0646440ddaef4cc6921c5cfe9231285b63a63bf97890f95288f70800c9232'',
        ''tests/consolidate_preservation.rs'': ''d00e5479605d5f21ac948965a404ecbca50ab927080320d1f3c8f80726537572''}

        for f,h in expected.items(): assert hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest()==h,f

        PYCODE

        git config user.name ''github-actions[bot]''

        git config user.email ''41898282+github-actions[bot]@users.noreply.github.com''

        git add src/tools_timeline.rs tests/consolidate_preservation.rs

        git commit -m "Preserve prior consolidated clips and undo audio"

        git fetch origin consolidate-guard main

        [ "$(git rev-parse origin/consolidate-guard)" = "$GITHUB_SHA" ]

        [ "$(git rev-parse origin/main)" = 73a8cf4c196b51c6739e31cbc33766d4dee20419
        ]

        git push origin HEAD:refs/heads/consolidate-guard

        '
