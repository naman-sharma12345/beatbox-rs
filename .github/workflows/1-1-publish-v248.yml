name: Publish slice boundary validation
'on':
  push:
    branches:
    - slice-boundaries
    paths:
    - .github/workflows/*publish-v248.yml
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'naman-sharma12345/beatbox-rs' && github.actor == 'naman-sharma12345'
      && github.ref == 'refs/heads/slice-boundaries'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Apply exact locally tested sample preservation patch
      shell: bash
      run: 'set -euo pipefail

        [ "$(git rev-parse HEAD^)" = fa6ce115f571cf7c22fff9bfc351c26758158996 ]

        [ "$(git rev-parse origin/main)" = fa6ce115f571cf7c22fff9bfc351c26758158996
        ]

        python3 - <<''PYCODE''

        import base64,gzip,hashlib,pathlib

        b=gzip.decompress(base64.b64decode(''''))

        assert hashlib.sha256(b).hexdigest()==''460fdc53b099c9e8725de798d488f02b06bd6ba8f8c9c2dd3ba4e8ce1e258572''

        pathlib.Path(''/tmp/checked.patch'').write_bytes(b)

        PYCODE

        git apply --check /tmp/checked.patch

        git apply /tmp/checked.patch

        python3 - <<''PYCODE''

        import hashlib,pathlib

        expected={''src/tools_sound.rs'': ''30beea83a266964ce5d53f6f7843fd264a07302f13c0160b790f08edd22fed1f'',
        ''tests/slice_boundaries.rs'': ''31cb5700faf528012762521e0205b68ebbd9840a0a8650c360a217ddd035ac70''}

        for f,h in expected.items(): assert hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest()==h,f

        PYCODE

        git config user.name ''github-actions[bot]''

        git config user.email ''41898282+github-actions[bot]@users.noreply.github.com''

        git add src/tools_sound.rs tests/slice_boundaries.rs

        git commit -m "Keep slice boundaries distinct and inside the source"

        git fetch origin slice-boundaries main

        [ "$(git rev-parse origin/slice-boundaries)" = "$GITHUB_SHA" ]

        [ "$(git rev-parse origin/main)" = fa6ce115f571cf7c22fff9bfc351c26758158996
        ]

        git push origin HEAD:refs/heads/slice-boundaries

        '
