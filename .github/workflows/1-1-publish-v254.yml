name: Publish stereo quantize validation
'on':
  push:
    branches:
    - stereo-quantize
    paths:
    - .github/workflows/*publish-v254.yml
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'naman-sharma12345/beatbox-rs' && github.actor == 'naman-sharma12345'
      && github.ref == 'refs/heads/stereo-quantize'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Apply exact locally tested sample preservation patch
      shell: bash
      run: 'set -euo pipefail

        [ "$(git rev-parse HEAD^)" = 783293d59fb9f80454645eb9cabf6ad3958e09da ]

        [ "$(git rev-parse origin/main)" = 783293d59fb9f80454645eb9cabf6ad3958e09da
        ]

        python3 - <<''PYCODE''

        import base64,gzip,hashlib,pathlib

        b=gzip.decompress(base64.b64decode(''''))

        assert hashlib.sha256(b).hexdigest()==''78f0a429cd32d8099ed4439ab840e60327cb55d75de259431e780bc441260981''

        pathlib.Path(''/tmp/checked.patch'').write_bytes(b)

        PYCODE

        git apply --check /tmp/checked.patch

        git apply /tmp/checked.patch

        python3 - <<''PYCODE''

        import hashlib,pathlib

        expected={''src/audio_edit.rs'': ''0660a39f648ee1d4b56be8d8cc798aa2644e045b35cb78fafc10932eb40258bd'',
        ''src/tools_sound.rs'': ''d178b020f34468df2e04a933096bc03f759f2a05cb30ed55a53e77d790fc3e48'',
        ''tests/stereo_quantize.rs'': ''6e3a5d9b42565e2d5f3b79881c5ba6bfe744cd95700612cc3ad4bab0df4d331d''}

        for f,h in expected.items(): assert hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest()==h,f

        PYCODE

        git config user.name ''github-actions[bot]''

        git config user.email ''41898282+github-actions[bot]@users.noreply.github.com''

        git add src/audio_edit.rs src/tools_sound.rs tests/stereo_quantize.rs

        git commit -m "Keep stereo channels aligned when quantizing samples"

        git fetch origin stereo-quantize main

        [ "$(git rev-parse origin/stereo-quantize)" = "$GITHUB_SHA" ]

        [ "$(git rev-parse origin/main)" = 783293d59fb9f80454645eb9cabf6ad3958e09da
        ]

        git push origin HEAD:refs/heads/stereo-quantize

        '
