name: Publish selectable checkpoint A/B excerpt
'on':
  push:
    branches:
    - ab-excerpt
    paths:
    - .github/workflows/*publish-v225.yml
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'naman-sharma12345/beatbox-rs' && github.actor == 'naman-sharma12345'
      && github.ref == 'refs/heads/ab-excerpt'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Apply verified selectable excerpt patch
      shell: bash
      run: "set -euo pipefail\n[ \"$(git rev-parse HEAD^)\" = 0a70529ac690481501357742f89a8b6855f09738\
        \ ]\n[ \"$(git rev-parse origin/main)\" = 0a70529ac690481501357742f89a8b6855f09738\
        \ ]\npython3 - <<'PYCODE'\nimport base64,gzip,hashlib,pathlib\nb=gzip.decompress(base64.b64decode(''))\n\
        assert hashlib.sha256(b).hexdigest()=='3119766c3c07577a8df7d4a6bfc6a792be1b0eb27ddf5eb3238da7c1852e5257'\n\
        pathlib.Path('/tmp/verified.patch').write_bytes(b)\nPYCODE\ngit apply --check\
        \ /tmp/verified.patch\ngit apply /tmp/verified.patch\npython3 - <<'PYCODE'\n\
        import hashlib,pathlib\nexpected={'src/gui/mod.rs': '3b8b6c7b6970b9c7487a0f30b98f2376835c919f3813474c378e808062980dfc',\
        \ 'src/gui/views.rs': '686118dbee47fcb80e6b0d48e08713f21d9450ea2d8aa19fa6e03a7d428fa010'}\n\
        for f,h in expected.items():\n assert hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest()==h,f\n\
        PYCODE\ngit config user.name 'github-actions[bot]'\ngit config user.email\
        \ '41898282+github-actions[bot]@users.noreply.github.com'\ngit add src/gui/mod.rs\
        \ src/gui/views.rs\ngit commit -m \"Choose elapsed-time excerpts for checkpoint\
        \ A/B\"\ngit fetch origin ab-excerpt main\n[ \"$(git rev-parse origin/ab-excerpt)\"\
        \ = \"$GITHUB_SHA\" ]\n[ \"$(git rev-parse origin/main)\" = 0a70529ac690481501357742f89a8b6855f09738\
        \ ]\ngit push origin HEAD:refs/heads/ab-excerpt\n"
