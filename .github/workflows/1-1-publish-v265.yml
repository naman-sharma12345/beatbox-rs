name: Publish audio clip owner removal preservation validation
'on':
  push:
    branches:
    - audio-owner-removal
    paths:
    - .github/workflows/*publish-v265.yml
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'naman-sharma12345/beatbox-rs' && github.actor == 'naman-sharma12345'
      && github.ref == 'refs/heads/audio-owner-removal'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Apply exact locally tested sample preservation patch
      shell: bash
      run: 'set -euo pipefail

        [ "$(git rev-parse HEAD^)" = b961208aa71544d0193bd6b727851b1f050ba422 ]

        [ "$(git rev-parse origin/main)" = b961208aa71544d0193bd6b727851b1f050ba422
        ]

        python3 - <<''PYCODE''

        import base64,gzip,hashlib,pathlib

        b=gzip.decompress(base64.b64decode(''''))

        assert hashlib.sha256(b).hexdigest()==''7dda6749b6107b455386d9704cdd9b7a564f0dcedc5ca834240526d102859876''

        pathlib.Path(''/tmp/checked.patch'').write_bytes(b)

        PYCODE

        git apply --check /tmp/checked.patch

        git apply /tmp/checked.patch

        python3 - <<''PYCODE''

        import hashlib,pathlib

        expected={''src/tools.rs'': ''a4ac6dbf1e6542861fc33a40958fa64b7b68d78cd8517b049e2991f1560ccd2e'',
        ''tests/track_audio_targets.rs'': ''873e4b151ab0e538fb34e12d8bca17a7704d25b677f79060f232b73fcb774acd''}

        for f,h in expected.items(): assert hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest()==h,f

        PYCODE

        git config user.name ''github-actions[bot]''

        git config user.email ''41898282+github-actions[bot]@users.noreply.github.com''

        git add src/tools.rs tests/track_audio_targets.rs

        git commit -m "Drop audio clips owned by deleted tracks"

        git fetch origin audio-owner-removal main

        [ "$(git rev-parse origin/audio-owner-removal)" = "$GITHUB_SHA" ]

        [ "$(git rev-parse origin/main)" = b961208aa71544d0193bd6b727851b1f050ba422
        ]

        git push origin HEAD:refs/heads/audio-owner-removal

        '
