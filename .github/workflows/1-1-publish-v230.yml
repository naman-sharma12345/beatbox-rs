name: Publish Browser background matched comparison
'on':
  push:
    branches:
    - browser-ab
    paths:
    - .github/workflows/*publish-v230.yml
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'naman-sharma12345/beatbox-rs' && github.actor == 'naman-sharma12345'
      && github.ref == 'refs/heads/browser-ab'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Apply verified Browser comparison patch
      shell: bash
      run: "set -euo pipefail\n[ \"$(git rev-parse HEAD^)\" = 22c8d4ff9dfdc011bad281ae2c1a924232c9952f\
        \ ]\n[ \"$(git rev-parse origin/main)\" = 22c8d4ff9dfdc011bad281ae2c1a924232c9952f\
        \ ]\npython3 - <<'PYCODE'\nimport base64,gzip,hashlib,pathlib\nb=gzip.decompress(base64.b64decode(''))\n\
        assert hashlib.sha256(b).hexdigest()=='b29e31349007c232d03c2734bcdc0af97a0a5ba87487a21700de8f3d486b6328'\n\
        pathlib.Path('/tmp/verified.patch').write_bytes(b)\nPYCODE\ngit apply --check\
        \ /tmp/verified.patch\ngit apply /tmp/verified.patch\npython3 - <<'PYCODE'\n\
        import hashlib,pathlib\nexpected={'src/gui/browser_view.rs': '675a8845b0ab11b73a91ce659d0b8e9f47beab57dd939cf43ecf3be7f4e2f522'}\n\
        for f,h in expected.items():\n assert hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest()==h,f\n\
        PYCODE\ngit config user.name 'github-actions[bot]'\ngit config user.email\
        \ '41898282+github-actions[bot]@users.noreply.github.com'\ngit add src/gui/browser_view.rs\n\
        git commit -m \"Prepare Browser matched comparisons in background\"\ngit fetch\
        \ origin browser-ab main\n[ \"$(git rev-parse origin/browser-ab)\" = \"$GITHUB_SHA\"\
        \ ]\n[ \"$(git rev-parse origin/main)\" = 22c8d4ff9dfdc011bad281ae2c1a924232c9952f\
        \ ]\ngit push origin HEAD:refs/heads/browser-ab\n"
