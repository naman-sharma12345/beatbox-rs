name: Fix verified v217 test fixtures
on:
  push:
    branches:
    - reel_dark
    paths:
    - .github/workflows/*fix-v217-ci.yml
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'naman-sharma12345/beatbox-rs' && github.actor == 'naman-sharma12345'
      && github.ref == 'refs/heads/reel_dark'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Apply hash-verified test-only lint fix
      shell: bash
      run: "set -euo pipefail\n[ \"$(git rev-parse HEAD^)\" = 6f24a75eb3b9a35820068135c96d5223a4e72f9b\
        \ ]\n[ \"$(git rev-parse origin/main)\" = 21e5049d55363c19307832d3405ebe113176274e\
        \ ]\npython3 - <<'PY'\nimport base64,hashlib,pathlib\nb=base64.b64decode('')\n\
        assert hashlib.sha256(b).hexdigest()=='32319307e48c2617566d79dc9807d0c21b5d272aafc5dde0b4d0b86a430c78ce'\n\
        pathlib.Path('/tmp/ci-fix.patch').write_bytes(b)\nPY\ngit apply --check /tmp/ci-fix.patch\n\
        git apply /tmp/ci-fix.patch\npython3 - <<'PY'\nimport pathlib,hashlib\nexpected={'src/multisample.rs':\
        \ 'ae99cb782f965e1209f58474c2643e7ff8db53b548615b4bbb8a569f80c875b0', 'src/render.rs':\
        \ '26c3f48af3e0289ccafeecf4d9630c196013c429c4b65935fa1d1760fb60b262', 'src/tools_ears.rs':\
        \ '36b5e7b06ea8e1eabb2b3b03e2bedc2fe75e41629bd50be77bd73d22e3fe42dc'}\nfor\
        \ f,h in expected.items():\n assert hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest()==h,f\n\
        PY\ngit config user.name 'github-actions[bot]'\ngit config user.email '41898282+github-actions[bot]@users.noreply.github.com'\n\
        git add src\ngit commit -m \"Fix test fixture clippy diagnostics without runtime\
        \ changes\"\ngit fetch origin reel_dark main\n[ \"$(git rev-parse origin/reel_dark)\"\
        \ = \"$GITHUB_SHA\" ]\n[ \"$(git rev-parse origin/main)\" = 21e5049d55363c19307832d3405ebe113176274e\
        \ ]\ngit push origin HEAD:refs/heads/reel_dark\n"
