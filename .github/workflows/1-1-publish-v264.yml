name: Publish source track removal preservation validation
'on':
  push:
    branches:
    - source-removal
    paths:
    - .github/workflows/*publish-v264.yml
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'naman-sharma12345/beatbox-rs' && github.actor == 'naman-sharma12345'
      && github.ref == 'refs/heads/source-removal'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Apply exact locally tested sample preservation patch
      shell: bash
      run: 'set -euo pipefail

        [ "$(git rev-parse HEAD^)" = c5926b8eb8edf47bba32367d1f24e95649548dd7 ]

        [ "$(git rev-parse origin/main)" = c5926b8eb8edf47bba32367d1f24e95649548dd7
        ]

        python3 - <<''PYCODE''

        import base64,gzip,hashlib,pathlib

        b=gzip.decompress(base64.b64decode(''''))

        assert hashlib.sha256(b).hexdigest()==''f7516df8ac4676b349d5fcd246ce0952506f22630aab60a1aeaeeaa692eb33a9''

        pathlib.Path(''/tmp/checked.patch'').write_bytes(b)

        PYCODE

        git apply --check /tmp/checked.patch

        git apply /tmp/checked.patch

        python3 - <<''PYCODE''

        import hashlib,pathlib

        expected={''src/tools.rs'': ''6551ede763ca24fa8c235b48173cb06c85b6bb3d087d0e9fbab759abced5e2c3'',
        ''src/tools_studio.rs'': ''3d002bed9d9d299eeacb50b7905b0aaaf675e0c8e0ddd29fa6600564605d0299'',
        ''tests/track_source_targets.rs'': ''3200ca530dacfde02dece4e7b14e72269ac363d07f3930038e49467c33cec4e6''}

        for f,h in expected.items(): assert hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest()==h,f

        PYCODE

        git config user.name ''github-actions[bot]''

        git config user.email ''41898282+github-actions[bot]@users.noreply.github.com''

        git add src/tools.rs src/tools_studio.rs tests/track_source_targets.rs

        git commit -m "Remove effects keyed to deleted tracks"

        git fetch origin source-removal main

        [ "$(git rev-parse origin/source-removal)" = "$GITHUB_SHA" ]

        [ "$(git rev-parse origin/main)" = c5926b8eb8edf47bba32367d1f24e95649548dd7
        ]

        git push origin HEAD:refs/heads/source-removal

        '
