name: Fix verified v220 default-feature regressions
on:
  push:
    branches:
    - reel_dark
    paths:
    - .github/workflows/*fix-v220-ci.yml
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'naman-sharma12345/beatbox-rs' && github.actor == 'naman-sharma12345'
      && github.ref == 'refs/heads/reel_dark'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Apply hash-verified clean-runner regression corrections
      shell: bash
      run: "set -euo pipefail\n[ \"$(git rev-parse HEAD^)\" = 85e3237963869768009c90094e508655197419b0\
        \ ]\n[ \"$(git rev-parse origin/main)\" = 21e5049d55363c19307832d3405ebe113176274e\
        \ ]\npython3 - <<'PYCODE'\nimport base64,hashlib,pathlib,gzip\nb=gzip.decompress(base64.b64decode(''))\n\
        assert hashlib.sha256(b).hexdigest()=='d51c6c998043ee1e41d58b4d7f1802cd3fbfafdff8754ca4d7e0347b63664c7c'\n\
        pathlib.Path('/tmp/ci-fix.patch').write_bytes(b)\nPYCODE\ngit apply --check\
        \ /tmp/ci-fix.patch\ngit apply /tmp/ci-fix.patch\npython3 - <<'PYCODE'\nimport\
        \ pathlib,hashlib\nexpected={'src/tools_sound.rs': '6ce6c9fb946f8c7de782b8fd201355a9c53e7fc1b425f339f1fd4ae2b2e9043b',\
        \ 'src/gui/piano.rs': '9bbba67fbba76b9b5554df83bdc349497c7585d3ac6ec3d949dcb46ae31496ec',\
        \ 'src/gui/manual_ui_tests.rs': 'c2f0ee20777eef50c83830b9b02f28e5677068fc044b317f2f38efa5a9006a2e',\
        \ 'src/gui/views.rs': 'ceaf4684d84b17e4583362adc9dd03a4b0d51b9e9ae1a682af959348885f8af1'}\n\
        for f,h in expected.items():\n assert hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest()==h,f\n\
        PYCODE\ngit config user.name 'github-actions[bot]'\ngit config user.email\
        \ '41898282+github-actions[bot]@users.noreply.github.com'\ngit add src tests\
        \ scripts\ngit commit -m \"Make recorded CI fixtures reproducible and repair\
        \ regression contracts\"\ngit fetch origin reel_dark main\n[ \"$(git rev-parse\
        \ origin/reel_dark)\" = \"$GITHUB_SHA\" ]\n[ \"$(git rev-parse origin/main)\"\
        \ = 21e5049d55363c19307832d3405ebe113176274e ]\ngit push origin HEAD:refs/heads/reel_dark\n"
