name: Publish stereo formant validation
'on':
  push:
    branches:
    - stereo-formant
    paths:
    - .github/workflows/*publish-v251.yml
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'naman-sharma12345/beatbox-rs' && github.actor == 'naman-sharma12345'
      && github.ref == 'refs/heads/stereo-formant'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Apply exact locally tested sample preservation patch
      shell: bash
      run: 'set -euo pipefail

        [ "$(git rev-parse HEAD^)" = 9e38a01ec5cca79dedf3de24055324dff2609fdf ]

        [ "$(git rev-parse origin/main)" = 9e38a01ec5cca79dedf3de24055324dff2609fdf
        ]

        python3 - <<''PYCODE''

        import base64,gzip,hashlib,pathlib

        b=gzip.decompress(base64.b64decode(''''))

        assert hashlib.sha256(b).hexdigest()==''bc6633ba527fbfbc0a73c66c955672f090850842e3fd6cd80165fa06f2b4112d''

        pathlib.Path(''/tmp/checked.patch'').write_bytes(b)

        PYCODE

        git apply --check /tmp/checked.patch

        git apply /tmp/checked.patch

        python3 - <<''PYCODE''

        import hashlib,pathlib

        expected={''src/tools_sound.rs'': ''6f3e29e12156d6c9f4cdf330b7093f8326fc50546ada323855b92c2193833745'',
        ''tests/stereo_formant.rs'': ''427fc71d1d6db50d784873f9b6a37a3da00e11bcbf622d9da85c9ae89e86feba''}

        for f,h in expected.items(): assert hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest()==h,f

        PYCODE

        git config user.name ''github-actions[bot]''

        git config user.email ''41898282+github-actions[bot]@users.noreply.github.com''

        git add src/tools_sound.rs tests/stereo_formant.rs

        git commit -m "Preserve stereo channels in formant sample shifts"

        git fetch origin stereo-formant main

        [ "$(git rev-parse origin/stereo-formant)" = "$GITHUB_SHA" ]

        [ "$(git rev-parse origin/main)" = 9e38a01ec5cca79dedf3de24055324dff2609fdf
        ]

        git push origin HEAD:refs/heads/stereo-formant

        '
