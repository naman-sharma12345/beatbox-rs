name: Publish registered stereo source parity
'on':
  push:
    branches:
    - stereo-source
    paths:
    - .github/workflows/*publish-v245.yml
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'naman-sharma12345/beatbox-rs' && github.actor == 'naman-sharma12345'
      && github.ref == 'refs/heads/stereo-source'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Apply exact locally tested sample preservation patch
      shell: bash
      run: 'set -euo pipefail

        [ "$(git rev-parse HEAD^)" = 438f2d6f9cbc3f3b72287ee0a7766382aac630e4 ]

        [ "$(git rev-parse origin/main)" = 438f2d6f9cbc3f3b72287ee0a7766382aac630e4
        ]

        python3 - <<''PYCODE''

        import base64,gzip,hashlib,pathlib

        b=gzip.decompress(base64.b64decode(''''))

        assert hashlib.sha256(b).hexdigest()==''6ea5a441edf0d60374208842ae718d0aec0e08d1b8645251e7351bd042ed53c8''

        pathlib.Path(''/tmp/checked.patch'').write_bytes(b)

        PYCODE

        git apply --check /tmp/checked.patch

        git apply /tmp/checked.patch

        python3 - <<''PYCODE''

        import hashlib,pathlib

        expected={''src/tools_sound.rs'': ''ae9f58cdfbab1e6f7e023781b93cff9ff02f35d135d4468bbfda8c0e4814f692'',
        ''tests/stereo_sources.rs'': ''070efd6abd623a0a918a7569016291e720b264b20659c905aba7ab374a3af94f''}

        for f,h in expected.items(): assert hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest()==h,f

        PYCODE

        git config user.name ''github-actions[bot]''

        git config user.email ''41898282+github-actions[bot]@users.noreply.github.com''

        git add src/tools_sound.rs tests/stereo_sources.rs

        git commit -m "Read original stereo channels for registered audio sources"

        git fetch origin stereo-source main

        [ "$(git rev-parse origin/stereo-source)" = "$GITHUB_SHA" ]

        [ "$(git rev-parse origin/main)" = 438f2d6f9cbc3f3b72287ee0a7766382aac630e4
        ]

        git push origin HEAD:refs/heads/stereo-source

        '
