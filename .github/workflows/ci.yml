name: Low Light isolated preview render
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CARGO_TERM_COLOR: always
      RAYON_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: delivery
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: f554d15f8ed978188bda0de4fcdf84244518e75c
          path: engine
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Install delivery encoder only
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Build pinned headless engine
        id: engine_build
        working-directory: engine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/delivery/artifacts/low-light-preview/ci-logs"
          git rev-parse HEAD | tee "$GITHUB_WORKSPACE/delivery/artifacts/low-light-preview/ci-logs/engine-commit.txt"
          cargo build --release --no-default-features --locked --bin beatbox -j 2 2>&1 | tee "$GITHUB_WORKSPACE/delivery/artifacts/low-light-preview/ci-logs/build.log"
          sha256sum target/release/beatbox > "$GITHUB_WORKSPACE/delivery/artifacts/low-light-preview/ci-logs/engine-sha256.txt"
      - name: Native load check then real render and technical QC
        shell: bash
        run: |
          set -euo pipefail
          cd delivery
          binary="$GITHUB_WORKSPACE/engine/target/release/beatbox"
          root=artifacts/low-light-preview
          python3 "$root/validate_native.py" "$binary" 2>&1 | tee "$root/ci-logs/native-load.log"
          python3 "$root/render_with_beatbox.py" "$binary" 2>&1 | tee "$root/ci-logs/render-qc.log"
          cp -a .openclaw/tmp/low-light-preview-render "$root/ci-logs/render-details"
          python3 "$root/validate_delivery.py" 2>&1 | tee "$root/ci-logs/delivery-gate.log"
      - name: Upload audio, exact project and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: low-light-preview-render
          retention-days: 7
          if-no-files-found: error
          path: |
            delivery/artifacts/low-light-preview/
            delivery/.openclaw/tmp/low-light-preview-render/
      - name: Verify reusable CLI even if audio QC failed
        id: cli_receipt
        if: always() && steps.engine_build.outcome == 'success'
        working-directory: engine
        shell: bash
        run: |
          set -euo pipefail
          test -s target/release/beatbox
          test -x target/release/beatbox
          sha256sum -c "$GITHUB_WORKSPACE/delivery/artifacts/low-light-preview/ci-logs/engine-sha256.txt"
      - name: Upload reusable headless CLI and source receipt
        if: always() && steps.cli_receipt.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: low-light-preview-headless-cli-linux-x64
          retention-days: 7
          if-no-files-found: error
          path: |
            engine/target/release/beatbox
            delivery/artifacts/low-light-preview/ci-logs/engine-commit.txt
            delivery/artifacts/low-light-preview/ci-logs/engine-sha256.txt
