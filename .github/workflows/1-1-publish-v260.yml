name: Publish effect removal target preservation validation
'on':
  push:
    branches:
    - fx-removal
    paths:
    - .github/workflows/*publish-v260.yml
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'naman-sharma12345/beatbox-rs' && github.actor == 'naman-sharma12345'
      && github.ref == 'refs/heads/fx-removal'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Apply exact locally tested sample preservation patch
      shell: bash
      run: 'set -euo pipefail

        [ "$(git rev-parse HEAD^)" = 8268d69a14136b6bbd1260f2a4f3f7f1e4783346 ]

        [ "$(git rev-parse origin/main)" = 8268d69a14136b6bbd1260f2a4f3f7f1e4783346
        ]

        python3 - <<''PYCODE''

        import base64,gzip,hashlib,pathlib

        b=gzip.decompress(base64.b64decode(''''))

        assert hashlib.sha256(b).hexdigest()==''1516b6c8548b277a39ea02ac7523f94e35f37bb35a785d651d661e2a748286c8''

        pathlib.Path(''/tmp/checked.patch'').write_bytes(b)

        PYCODE

        git apply --check /tmp/checked.patch

        git apply /tmp/checked.patch

        python3 - <<''PYCODE''

        import hashlib,pathlib

        expected={''src/tools_studio.rs'': ''66feb62f9785254434ddb65c5d8a09a5b02880fef878db65dda41f78db61e9c9'',
        ''tests/fx_remove_targets.rs'': ''f794e1055f9f5952a822c43c37975fc21e9a9049677ee15c7c0e5bfc874c9baa''}

        for f,h in expected.items(): assert hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest()==h,f

        PYCODE

        git config user.name ''github-actions[bot]''

        git config user.email ''41898282+github-actions[bot]@users.noreply.github.com''

        git add src/tools_studio.rs tests/fx_remove_targets.rs

        git commit -m "Preserve surviving controls and drop deleted effect targets"

        git fetch origin fx-removal main

        [ "$(git rev-parse origin/fx-removal)" = "$GITHUB_SHA" ]

        [ "$(git rev-parse origin/main)" = 8268d69a14136b6bbd1260f2a4f3f7f1e4783346
        ]

        git push origin HEAD:refs/heads/fx-removal

        '
