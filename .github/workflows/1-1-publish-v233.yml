name: Publish fail-closed denoise candidate guard
'on':
  push:
    branches:
    - denoise-guard
    paths:
    - .github/workflows/*publish-v233.yml
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'naman-sharma12345/beatbox-rs' && github.actor == 'naman-sharma12345'
      && github.ref == 'refs/heads/denoise-guard'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Apply exact locally tested denoise guard
      shell: bash
      run: 'set -euo pipefail

        [ "$(git rev-parse HEAD^)" = 8206b4afbb8b69a4bf707fee47d39067b2fa3fa4 ]

        [ "$(git rev-parse origin/main)" = 8206b4afbb8b69a4bf707fee47d39067b2fa3fa4
        ]

        python3 - <<''PYCODE''

        import base64,gzip,hashlib,pathlib

        b=gzip.decompress(base64.b64decode(''''))

        assert hashlib.sha256(b).hexdigest()==''e106d9ac2b909a85572a3884cfc7ddc17fde5f2f08fca87a517f12683d97dd12''

        pathlib.Path(''/tmp/checked.patch'').write_bytes(b)

        PYCODE

        git apply --check /tmp/checked.patch

        git apply /tmp/checked.patch

        python3 - <<''PYCODE''

        import hashlib,pathlib

        assert hashlib.sha256(pathlib.Path(''src/voice_ai.rs'').read_bytes()).hexdigest()==''ccc5a9d5f4d984e6797d6bebea72bbadb7c635df051d302ed90ed6ce41dfa6bc''

        PYCODE

        git config user.name ''github-actions[bot]''

        git config user.email ''41898282+github-actions[bot]@users.noreply.github.com''

        git add src/voice_ai.rs

        git commit -m "Keep denoised candidates without replacing clips when quality
        evidence is unavailable"

        git fetch origin denoise-guard main

        [ "$(git rev-parse origin/denoise-guard)" = "$GITHUB_SHA" ]

        [ "$(git rev-parse origin/main)" = 8206b4afbb8b69a4bf707fee47d39067b2fa3fa4
        ]

        git push origin HEAD:refs/heads/denoise-guard

        '
