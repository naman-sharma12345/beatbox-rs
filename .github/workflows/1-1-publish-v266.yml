name: Publish MIDI owner identity validation
'on':
  push:
    branches:
    - midi-owner-identity
    paths:
    - .github/workflows/*publish-v266.yml
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'naman-sharma12345/beatbox-rs' && github.actor == 'naman-sharma12345'
      && github.ref == 'refs/heads/midi-owner-identity'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Apply exact locally tested sample preservation patch
      shell: bash
      run: 'set -euo pipefail

        [ "$(git rev-parse HEAD^)" = cb11c769d2661d5cfc9da27d8a3e773e1687eaf5 ]

        [ "$(git rev-parse origin/main)" = cb11c769d2661d5cfc9da27d8a3e773e1687eaf5
        ]

        python3 - <<''PYCODE''

        import base64,gzip,hashlib,pathlib

        b=gzip.decompress(base64.b64decode(''''))

        assert hashlib.sha256(b).hexdigest()==''e2ece17ea0304a231c635632458f3c029144de94ebb82645de6e572b24e9c59c''

        pathlib.Path(''/tmp/checked.patch'').write_bytes(b)

        PYCODE

        git apply --check /tmp/checked.patch

        git apply /tmp/checked.patch

        python3 - <<''PYCODE''

        import hashlib,pathlib

        expected={''src/midi_in.rs'': ''5100becab7c742ef31b4225f0f7858108269fdd68938128523ab307e9f422067'',
        ''src/gui/browser_view.rs'': ''9cc0d13e1f7d0d9b9ee0a5a7d583c3322ac6cf7355f7a72df330ebcdaf61db31'',
        ''tests/track_midi_targets.rs'': ''53d31b661b97de8bfd1745236ed81d0d76ab984b30cf1b384f1af3bdcc7c5aac''}

        for f,h in expected.items(): assert hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest()==h,f

        PYCODE

        git config user.name ''github-actions[bot]''

        git config user.email ''41898282+github-actions[bot]@users.noreply.github.com''

        git add src/midi_in.rs src/gui/browser_view.rs tests/track_midi_targets.rs

        git commit -m "Bind MIDI mixer controls to stable track identity"

        git fetch origin midi-owner-identity main

        [ "$(git rev-parse origin/midi-owner-identity)" = "$GITHUB_SHA" ]

        [ "$(git rev-parse origin/main)" = cb11c769d2661d5cfc9da27d8a3e773e1687eaf5
        ]

        git push origin HEAD:refs/heads/midi-owner-identity

        '
