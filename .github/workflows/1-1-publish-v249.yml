name: Publish stereo spectral edit validation
'on':
  push:
    branches:
    - stereo-spectral
    paths:
    - .github/workflows/*publish-v249.yml
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'naman-sharma12345/beatbox-rs' && github.actor == 'naman-sharma12345'
      && github.ref == 'refs/heads/stereo-spectral'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Apply exact locally tested sample preservation patch
      shell: bash
      run: 'set -euo pipefail

        [ "$(git rev-parse HEAD^)" = 4229de08dd46e8b5f5b778123219f735b73d1989 ]

        [ "$(git rev-parse origin/main)" = 4229de08dd46e8b5f5b778123219f735b73d1989
        ]

        python3 - <<''PYCODE''

        import base64,gzip,hashlib,pathlib

        b=gzip.decompress(base64.b64decode(''''))

        assert hashlib.sha256(b).hexdigest()==''b5e687fa0bdeda4c536c1efd323de75097748b54100bc5d4c541cf60fa1be9a0''

        pathlib.Path(''/tmp/checked.patch'').write_bytes(b)

        PYCODE

        git apply --check /tmp/checked.patch

        git apply /tmp/checked.patch

        python3 - <<''PYCODE''

        import hashlib,pathlib

        expected={''src/tools_sound.rs'': ''a0d52e331eda35db7e452d2e7831c4ca829a8ad6d5c954f38796797fcb17f6dd'',
        ''tests/stereo_spectral.rs'': ''1cb939c956287c4890abb9bb1fd2df7db120f66f54168942406b5b266993b2b5''}

        for f,h in expected.items(): assert hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest()==h,f

        PYCODE

        git config user.name ''github-actions[bot]''

        git config user.email ''41898282+github-actions[bot]@users.noreply.github.com''

        git add src/tools_sound.rs tests/stereo_spectral.rs

        git commit -m "Preserve stereo channels in spectral sample edits"

        git fetch origin stereo-spectral main

        [ "$(git rev-parse origin/stereo-spectral)" = "$GITHUB_SHA" ]

        [ "$(git rev-parse origin/main)" = 4229de08dd46e8b5f5b778123219f735b73d1989
        ]

        git push origin HEAD:refs/heads/stereo-spectral

        '
