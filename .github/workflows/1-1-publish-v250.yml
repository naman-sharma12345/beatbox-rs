name: Publish stereo denoise validation
'on':
  push:
    branches:
    - stereo-denoise
    paths:
    - .github/workflows/*publish-v250.yml
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'naman-sharma12345/beatbox-rs' && github.actor == 'naman-sharma12345'
      && github.ref == 'refs/heads/stereo-denoise'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Apply exact locally tested sample preservation patch
      shell: bash
      run: 'set -euo pipefail

        [ "$(git rev-parse HEAD^)" = 0ba7113be1f9c0c618dd904e1d2ff04af3f83c3e ]

        [ "$(git rev-parse origin/main)" = 0ba7113be1f9c0c618dd904e1d2ff04af3f83c3e
        ]

        python3 - <<''PYCODE''

        import base64,gzip,hashlib,pathlib

        b=gzip.decompress(base64.b64decode(''''))

        assert hashlib.sha256(b).hexdigest()==''92a2f6ba3438494893ea3e93eda14f91643eb7f0d62bbcccc0d655bafe7f67ff''

        pathlib.Path(''/tmp/checked.patch'').write_bytes(b)

        PYCODE

        git apply --check /tmp/checked.patch

        git apply /tmp/checked.patch

        python3 - <<''PYCODE''

        import hashlib,pathlib

        expected={''src/tools_sound.rs'': ''01f9ddd035df1b0d5d8cfc50f23c03d0c9e1ded7586f12165896d2d9faaa0745'',
        ''tests/stereo_denoise.rs'': ''8d8702dbeb9b87c5bb68fdac9a0884db9dfa4d626d751706aafbaa1fbdd4cc04''}

        for f,h in expected.items(): assert hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest()==h,f

        PYCODE

        git config user.name ''github-actions[bot]''

        git config user.email ''41898282+github-actions[bot]@users.noreply.github.com''

        git add src/tools_sound.rs tests/stereo_denoise.rs

        git commit -m "Preserve stereo channels when denoising samples"

        git fetch origin stereo-denoise main

        [ "$(git rev-parse origin/stereo-denoise)" = "$GITHUB_SHA" ]

        [ "$(git rev-parse origin/main)" = 0ba7113be1f9c0c618dd904e1d2ff04af3f83c3e
        ]

        git push origin HEAD:refs/heads/stereo-denoise

        '
