name: Publish distinct stem export names
'on':
  push:
    branches:
    - stem-names
    paths:
    - .github/workflows/*publish-v238.yml
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'naman-sharma12345/beatbox-rs' && github.actor == 'naman-sharma12345'
      && github.ref == 'refs/heads/stem-names'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Apply exact locally tested sample preservation patch
      shell: bash
      run: 'set -euo pipefail

        [ "$(git rev-parse HEAD^)" = f401ad6d1cbc89768bee6eca5cb3f74e4bd72371 ]

        [ "$(git rev-parse origin/main)" = f401ad6d1cbc89768bee6eca5cb3f74e4bd72371
        ]

        python3 - <<''PYCODE''

        import base64,gzip,hashlib,pathlib

        b=gzip.decompress(base64.b64decode(''''))

        assert hashlib.sha256(b).hexdigest()==''50fba6051ccd1f3f8f7d9c1465b425185c469564eedcb2ae8f6c2c68bcc560c2''

        pathlib.Path(''/tmp/checked.patch'').write_bytes(b)

        PYCODE

        git apply --check /tmp/checked.patch

        git apply /tmp/checked.patch

        python3 - <<''PYCODE''

        import hashlib,pathlib

        expected={''src/samples.rs'': ''9d43e3d0ad5f4375975bab5148f4c85bf2a80a069b5d5bf04975da36c9887fcf'',
        ''src/tools.rs'': ''ba7ba12b1e74afb94d424620a0e1f16db5c2b06ca16857e8d1d7bb3c1e05aae8'',
        ''src/tools_delivery.rs'': ''1dd5acfe9a37525f5544be81db6cfa93e1175470c4020936dfc1471c8e9ddd01'',
        ''tests/stem_names.rs'': ''5fbbe574a209ea4bcd175f162dee44a8052669e57e97d8b24c7d0f408a272f85''}

        for f,h in expected.items(): assert hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest()==h,f

        PYCODE

        git config user.name ''github-actions[bot]''

        git config user.email ''41898282+github-actions[bot]@users.noreply.github.com''

        git add src/samples.rs src/tools.rs src/tools_delivery.rs tests/stem_names.rs

        git commit -m "Keep distinct stem exports from sharing sanitized file paths"

        git fetch origin stem-names main

        [ "$(git rev-parse origin/stem-names)" = "$GITHUB_SHA" ]

        [ "$(git rev-parse origin/main)" = f401ad6d1cbc89768bee6eca5cb3f74e4bd72371
        ]

        git push origin HEAD:refs/heads/stem-names

        '
