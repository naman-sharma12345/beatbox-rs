name: Fix verified v219 reproducible regression inputs
on:
  push:
    branches:
    - reel_dark
    paths:
    - .github/workflows/*fix-v219b-ci.yml
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'naman-sharma12345/beatbox-rs' && github.actor == 'naman-sharma12345'
      && github.ref == 'refs/heads/reel_dark'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Apply hash-verified clean-runner regression corrections
      shell: bash
      run: "set -euo pipefail\n[ \"$(git rev-parse HEAD^)\" = df794947564c2c93c0d5e6b1ceac471cd696757e\
        \ ]\n[ \"$(git rev-parse origin/main)\" = 21e5049d55363c19307832d3405ebe113176274e\
        \ ]\npython3 - <<'PYCODE'\nimport base64,hashlib,pathlib,gzip\nb=gzip.decompress(base64.b64decode(''))\n\
        assert hashlib.sha256(b).hexdigest()=='99a527e8c255cca55db5f7d9b7fe4898230c4bc3ba11e10484207ce044042bc3'\n\
        pathlib.Path('/tmp/ci-fix.patch').write_bytes(b)\nPYCODE\ngit apply --check\
        \ /tmp/ci-fix.patch\ngit apply /tmp/ci-fix.patch\npython3 - <<'PYCODE'\nimport\
        \ pathlib,hashlib\nexpected={'src/tools_chain.rs': '37d6e01429b496105820dc84afb2e6e08ce3f9a79f92d4fd737989c68595e488',\
        \ 'src/tools.rs': '5282bc495d0cae76bb86c54ad7f0e94d68511b706487f4f8a7d74be6c68b7b36',\
        \ 'src/tools_midi.rs': '01e82c55f961a60973590c8acbb55b7d56210ef9a0ff978537ed3459b1bd64cf',\
        \ 'src/rt.rs': '1b487e164c766524ac1c565561cf81596f02dca3440a4a3f02b626d7b9441121',\
        \ 'src/render.rs': '382b243b935906cb1fe5cd8e6db072085686fa99383d48e35c3602451d81a584',\
        \ 'src/multisample.rs': 'b933005e8c4e3b1e8b0848dd37cf028cd2e448afa556aa13bf17aff1c33589c9',\
        \ 'src/listen.rs': 'a9204c3e22d1748e97c8494489c3754f4dd06f5e58ff95b703106ca2ceea130f',\
        \ 'src/tools_markers.rs': 'a6df6d4afdd41bc005316817ff9b45490300e06a4713a6042c982f70834984bd',\
        \ 'src/tools_library.rs': '7e5b782cfec9a2000cdb4dacb37677079e98d93d9b387bd5357741bcc1bdbe27',\
        \ 'src/tools_categories.rs': '40d0540397baa79b79ef02b9d798f9e518dd00eb7fb786c58a93f67a68efc359',\
        \ 'src/test_fixtures.rs': '957c06905eb6810f0059798de45833d0a376b696353e6ef7fc2311736a55d979',\
        \ 'src/lib.rs': '5a9968ef394d7195c2db5ba3ab09228504d36abfdd282a915f18a80dbf8178cc',\
        \ 'src/gui/export_view.rs': '9b669aaa214c86766d3945a14dec2276ae37b15da4bf1d74722297736a9866c1',\
        \ 'src/gui/mod.rs': '574cb39a1fb4d4e98cb9c305df1698bc79b4f3ed5fc6897b2a633bcd01fbcf76',\
        \ 'scripts/prepare_test_fixtures.py': '6662af4378120802336332601b7bac674c7b51ced58360e2e21f15d83d31ef04',\
        \ 'tests/fixtures/recorded/v202-gui-after.json': 'd31d52b154dbc656de283729838028453d175e7d4d78d9c832740db47a1fca09',\
        \ 'tests/fixtures/recorded/README.md': 'eae39f0a054640cbe41d11275fae568325e849f4db69a2d2fff9d1be750c96bf',\
        \ 'tests/fixtures/recorded/recorded-groove.json': '6acb00e67b4e6348c0c87aa3bd76990391694608fc0e258cf67240976f8ef96e',\
        \ 'tests/fixtures/recorded/roll-empty-fixture.json': '1e5fdb1f9c5c638e218b2890cc8dc95c0a42c1ef20ce378b733d1ab2f8fd6bd2',\
        \ 'tests/fixtures/recorded/room-demo.json': '627c4177a7aa41b457d62678f4262da3f0ed70f39a8376b4fe2411a0bd86cdcc',\
        \ 'tests/fixtures/recorded/keys-demo.json': '74e340253eca4fea10192fbceaad7d1b337a50358bd780382ab2b4395593913e',\
        \ 'tests/fixtures/recorded/manifest.json': '68ffa52cf1a31874bf10572274bc7676c15bb42bab644ed82372a88fa2471cbb'}\n\
        for f,h in expected.items():\n assert hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest()==h,f\n\
        PYCODE\ngit config user.name 'github-actions[bot]'\ngit config user.email\
        \ '41898282+github-actions[bot]@users.noreply.github.com'\ngit add src tests\
        \ scripts\ngit commit -m \"Make recorded CI fixtures reproducible and repair\
        \ regression contracts\"\ngit fetch origin reel_dark main\n[ \"$(git rev-parse\
        \ origin/reel_dark)\" = \"$GITHUB_SHA\" ]\n[ \"$(git rev-parse origin/main)\"\
        \ = 21e5049d55363c19307832d3405ebe113176274e ]\ngit push origin HEAD:refs/heads/reel_dark\n"
