name: Publish stereo silence stripping
'on':
  push:
    branches:
    - stereo-strip
    paths:
    - .github/workflows/*publish-v246.yml
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'naman-sharma12345/beatbox-rs' && github.actor == 'naman-sharma12345'
      && github.ref == 'refs/heads/stereo-strip'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Apply exact locally tested sample preservation patch
      shell: bash
      run: 'set -euo pipefail

        [ "$(git rev-parse HEAD^)" = 6c8ed476172781798022947a5280210d0e73c3b5 ]

        [ "$(git rev-parse origin/main)" = 6c8ed476172781798022947a5280210d0e73c3b5
        ]

        python3 - <<''PYCODE''

        import base64,gzip,hashlib,pathlib

        b=gzip.decompress(base64.b64decode(''''))

        assert hashlib.sha256(b).hexdigest()==''5a628581312960dca9171d96d54b217a4e26144ea555760db8d99f2d366e9fb4''

        pathlib.Path(''/tmp/checked.patch'').write_bytes(b)

        PYCODE

        git apply --check /tmp/checked.patch

        git apply /tmp/checked.patch

        python3 - <<''PYCODE''

        import hashlib,pathlib

        expected={''src/tools_mix.rs'': ''83c0c8b30e009b8fe275c7b6a178fc60c3775c0e7ee04cb097e8dfd2d1a6c7c1'',
        ''tests/stereo_strip.rs'': ''3e69dafb7e03a04635a968c2ca5ef25d1c3697ec1c698985cc43425c64e22a06''}

        for f,h in expected.items(): assert hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest()==h,f

        PYCODE

        git config user.name ''github-actions[bot]''

        git config user.email ''41898282+github-actions[bot]@users.noreply.github.com''

        git add src/tools_mix.rs tests/stereo_strip.rs

        git commit -m "Preserve stereo regions when stripping silence"

        git fetch origin stereo-strip main

        [ "$(git rev-parse origin/stereo-strip)" = "$GITHUB_SHA" ]

        [ "$(git rev-parse origin/main)" = 6c8ed476172781798022947a5280210d0e73c3b5
        ]

        git push origin HEAD:refs/heads/stereo-strip

        '
