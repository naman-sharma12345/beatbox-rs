name: Publish stereo-preserving basic sample edits
'on':
  push:
    branches:
    - stereo-edit
    paths:
    - .github/workflows/*publish-v244.yml
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'naman-sharma12345/beatbox-rs' && github.actor == 'naman-sharma12345'
      && github.ref == 'refs/heads/stereo-edit'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Apply exact locally tested sample preservation patch
      shell: bash
      run: 'set -euo pipefail

        [ "$(git rev-parse HEAD^)" = 9281c036b3c447c6984a4ff435129f596cd6c34c ]

        [ "$(git rev-parse origin/main)" = 9281c036b3c447c6984a4ff435129f596cd6c34c
        ]

        python3 - <<''PYCODE''

        import base64,gzip,hashlib,pathlib

        b=gzip.decompress(base64.b64decode(''''))

        assert hashlib.sha256(b).hexdigest()==''a2c1cba998fa9641b0582c6067d89370f8916d30524dd2d4c1fdffc14ccccde9''

        pathlib.Path(''/tmp/checked.patch'').write_bytes(b)

        PYCODE

        git apply --check /tmp/checked.patch

        git apply /tmp/checked.patch

        python3 - <<''PYCODE''

        import hashlib,pathlib

        expected={''src/tools_sound.rs'': ''490d21e1d33cc041a720c3e1eaec8ed08fbbd6478c16057531066dd65ab12106'',
        ''tests/stereo_edits.rs'': ''e59f67c1b3b9571cd360ef5101b5a07b1ba0e0f4d67ffde66f0ef7c87ae7073a''}

        for f,h in expected.items(): assert hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest()==h,f

        PYCODE

        git config user.name ''github-actions[bot]''

        git config user.email ''41898282+github-actions[bot]@users.noreply.github.com''

        git add src/tools_sound.rs tests/stereo_edits.rs

        git commit -m "Preserve stereo channels through basic sample edits"

        git fetch origin stereo-edit main

        [ "$(git rev-parse origin/stereo-edit)" = "$GITHUB_SHA" ]

        [ "$(git rev-parse origin/main)" = 9281c036b3c447c6984a4ff435129f596cd6c34c
        ]

        git push origin HEAD:refs/heads/stereo-edit

        '
