name: Publish stereo onset validation
'on':
  push:
    branches:
    - stereo-onsets
    paths:
    - .github/workflows/*publish-v256.yml
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'naman-sharma12345/beatbox-rs' && github.actor == 'naman-sharma12345'
      && github.ref == 'refs/heads/stereo-onsets'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Apply exact locally tested sample preservation patch
      shell: bash
      run: 'set -euo pipefail

        [ "$(git rev-parse HEAD^)" = d5f3e8e462d534628e820c8cd59f431c01a5b588 ]

        [ "$(git rev-parse origin/main)" = d5f3e8e462d534628e820c8cd59f431c01a5b588
        ]

        python3 - <<''PYCODE''

        import base64,gzip,hashlib,pathlib

        b=gzip.decompress(base64.b64decode(''''))

        assert hashlib.sha256(b).hexdigest()==''2e15f276a1a503c8ab216aba430032f65807d850e05e25a033014d3df2f93504''

        pathlib.Path(''/tmp/checked.patch'').write_bytes(b)

        PYCODE

        git apply --check /tmp/checked.patch

        git apply /tmp/checked.patch

        python3 - <<''PYCODE''

        import hashlib,pathlib

        expected={''src/audio_edit.rs'': ''c3d8fa8105b2d2b2dcc521fb6a56291d67016d83bcb65066fd0a47b692938adc'',
        ''src/tools_sound.rs'': ''b31bb3c88c004982da56edc6e0b13f12f513ff2a042a7e41bc5fdf838f28580e'',
        ''tests/stereo_detection.rs'': ''865518b9c295c13dc8699a879d8b151d1465fadccaa5a08ca638daab5fcb2a9b''}

        for f,h in expected.items(): assert hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest()==h,f

        PYCODE

        git config user.name ''github-actions[bot]''

        git config user.email ''41898282+github-actions[bot]@users.noreply.github.com''

        git add src/audio_edit.rs src/tools_sound.rs tests/stereo_detection.rs

        git commit -m "Detect stereo attacks without mono cancellation"

        git fetch origin stereo-onsets main

        [ "$(git rev-parse origin/stereo-onsets)" = "$GITHUB_SHA" ]

        [ "$(git rev-parse origin/main)" = d5f3e8e462d534628e820c8cd59f431c01a5b588
        ]

        git push origin HEAD:refs/heads/stereo-onsets

        '
