name: Publish stereo key validation
'on':
  push:
    branches:
    - stereo-key
    paths:
    - .github/workflows/*publish-v258.yml
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'naman-sharma12345/beatbox-rs' && github.actor == 'naman-sharma12345'
      && github.ref == 'refs/heads/stereo-key'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Apply exact locally tested sample preservation patch
      shell: bash
      run: 'set -euo pipefail

        [ "$(git rev-parse HEAD^)" = 781f0274ce06b39d685e58be6475923bde7fb0b8 ]

        [ "$(git rev-parse origin/main)" = 781f0274ce06b39d685e58be6475923bde7fb0b8
        ]

        python3 - <<''PYCODE''

        import base64,gzip,hashlib,pathlib

        b=gzip.decompress(base64.b64decode(''''))

        assert hashlib.sha256(b).hexdigest()==''183508b2d5f60175e4a9f56146ae6da54768d339cad979c7e1f31342fdf61b39''

        pathlib.Path(''/tmp/checked.patch'').write_bytes(b)

        PYCODE

        git apply --check /tmp/checked.patch

        git apply /tmp/checked.patch

        python3 - <<''PYCODE''

        import hashlib,pathlib

        expected={''src/audio_edit.rs'': ''522b00dc0496255b277d99acb057c4ff67b4fa301c4d16a63f5cdc119f0c6788'',
        ''src/tools_sound.rs'': ''6b585ac0778dda17b041f7c9aa54dc4ea72dc2d7a5e70c6c1d5b59b32f1b7380'',
        ''tests/stereo_key.rs'': ''088dc4b7cb8db235b2d7fc14d14acc5228a63204ce93566f508d4ec98538feeb''}

        for f,h in expected.items(): assert hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest()==h,f

        PYCODE

        git config user.name ''github-actions[bot]''

        git config user.email ''41898282+github-actions[bot]@users.noreply.github.com''

        git add src/audio_edit.rs src/tools_sound.rs tests/stereo_key.rs

        git commit -m "Estimate stereo key without mono cancellation"

        git fetch origin stereo-key main

        [ "$(git rev-parse origin/stereo-key)" = "$GITHUB_SHA" ]

        [ "$(git rev-parse origin/main)" = 781f0274ce06b39d685e58be6475923bde7fb0b8
        ]

        git push origin HEAD:refs/heads/stereo-key

        '
