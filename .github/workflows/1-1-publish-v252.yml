name: Publish stereo stretch validation
'on':
  push:
    branches:
    - stereo-stretch
    paths:
    - .github/workflows/*publish-v252.yml
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'naman-sharma12345/beatbox-rs' && github.actor == 'naman-sharma12345'
      && github.ref == 'refs/heads/stereo-stretch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Apply exact locally tested sample preservation patch
      shell: bash
      run: 'set -euo pipefail

        [ "$(git rev-parse HEAD^)" = 4c41abd741de2dee435eaf018c9463e8e8df77bf ]

        [ "$(git rev-parse origin/main)" = 4c41abd741de2dee435eaf018c9463e8e8df77bf
        ]

        python3 - <<''PYCODE''

        import base64,gzip,hashlib,pathlib

        b=gzip.decompress(base64.b64decode(''''))

        assert hashlib.sha256(b).hexdigest()==''6cade6db997cc78183de7189e3feae291af2310490a4330531a3f4ccad6383d2''

        pathlib.Path(''/tmp/checked.patch'').write_bytes(b)

        PYCODE

        git apply --check /tmp/checked.patch

        git apply /tmp/checked.patch

        python3 - <<''PYCODE''

        import hashlib,pathlib

        expected={''src/audio_edit.rs'': ''58c226b482cfafe4765ea368d7c7def52a8787d58546a6fb12ac0b4deb1861ce'',
        ''src/tools_sound.rs'': ''8396352791b7a81ebdb82799bd808579e1d8d6a2142293ee0058f69e4039433c'',
        ''tests/stereo_stretch.rs'': ''2755f2d60c87780ef03de36d834cfb8e71b35077434365b994416740d0b207ec''}

        for f,h in expected.items(): assert hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest()==h,f

        PYCODE

        git config user.name ''github-actions[bot]''

        git config user.email ''41898282+github-actions[bot]@users.noreply.github.com''

        git add src/audio_edit.rs src/tools_sound.rs tests/stereo_stretch.rs

        git commit -m "Keep stereo alignment through sample stretch and pitch shifts"

        git fetch origin stereo-stretch main

        [ "$(git rev-parse origin/stereo-stretch)" = "$GITHUB_SHA" ]

        [ "$(git rev-parse origin/main)" = 4c41abd741de2dee435eaf018c9463e8e8df77bf
        ]

        git push origin HEAD:refs/heads/stereo-stretch

        '
