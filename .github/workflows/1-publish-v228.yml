name: Guard Vocal Room scores when source evidence is absent
'on':
  push:
    branches:
    - voice-evidence
    paths:
    - .github/workflows/*publish-v228.yml
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'naman-sharma12345/beatbox-rs' && github.actor == 'naman-sharma12345'
      && github.ref == 'refs/heads/voice-evidence'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Apply verified voice-evidence patch
      shell: bash
      run: "set -euo pipefail\n[ \"$(git rev-parse HEAD^)\" = 25833a3b988ca5fe45918c1e371a1affc81c34d4\
        \ ]\n[ \"$(git rev-parse origin/main)\" = 25833a3b988ca5fe45918c1e371a1affc81c34d4\
        \ ]\npython3 - <<'PYCODE'\nimport base64,gzip,hashlib,pathlib\nb=gzip.decompress(base64.b64decode(''))\n\
        assert hashlib.sha256(b).hexdigest()=='ffed6c96befd089f2b5e2823efd9cb61ac8088ac289ce1c776511d59cb1ffa47'\n\
        pathlib.Path('/tmp/verified.patch').write_bytes(b)\nPYCODE\ngit apply --check\
        \ /tmp/verified.patch\ngit apply /tmp/verified.patch\npython3 - <<'PYCODE'\n\
        import hashlib,pathlib\nexpected={'src/gui/views.rs': '07bf345381b194e64d7be8a5ad2a1c1ecaceeed0905949eb2008a612ee5b3024',\
        \ 'src/tools_ears_pro.rs': '847f69dc9a2d631b987bf0c7b5c46a1389ad7187574ad011b73db5313fb85e91',\
        \ 'src/ears_pro.rs': 'ab2a0e4295799c5babadf049f5cb78c36fd8ba210d8020d996b3dfef3b142b6c'}\n\
        for f,h in expected.items():\n assert hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest()==h,f\n\
        PYCODE\ngit config user.name 'github-actions[bot]'\ngit config user.email\
        \ '41898282+github-actions[bot]@users.noreply.github.com'\ngit add src/gui/views.rs\
        \ src/tools_ears_pro.rs src/ears_pro.rs\ngit commit -m \"Do not score absent\
        \ Vocal Room source evidence\"\ngit fetch origin voice-evidence main\n[ \"\
        $(git rev-parse origin/voice-evidence)\" = \"$GITHUB_SHA\" ]\n[ \"$(git rev-parse\
        \ origin/main)\" = 25833a3b988ca5fe45918c1e371a1affc81c34d4 ]\ngit push origin\
        \ HEAD:refs/heads/voice-evidence\n"
