name: Publish explicit Vocal Room source selection
'on':
  push:
    branches:
    - vocal-source
    paths:
    - .github/workflows/*publish-v227.yml
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'naman-sharma12345/beatbox-rs' && github.actor == 'naman-sharma12345'
      && github.ref == 'refs/heads/vocal-source'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Apply verified Vocal Room source patch
      shell: bash
      run: "set -euo pipefail\n[ \"$(git rev-parse HEAD^)\" = e3163461f427c44cae3279f7af6262aceb2ac4ac\
        \ ]\n[ \"$(git rev-parse origin/main)\" = e3163461f427c44cae3279f7af6262aceb2ac4ac\
        \ ]\npython3 - <<'PYCODE'\nimport base64,gzip,hashlib,pathlib\nb=gzip.decompress(base64.b64decode(''))\n\
        assert hashlib.sha256(b).hexdigest()=='cb707ad67022c5d66361cd8478c21ab27579ebeb8449c201b4d1455109fa3dcc'\n\
        pathlib.Path('/tmp/verified.patch').write_bytes(b)\nPYCODE\ngit apply --check\
        \ /tmp/verified.patch\ngit apply /tmp/verified.patch\npython3 - <<'PYCODE'\n\
        import hashlib,pathlib\nexpected={'src/gui/views.rs': '6e0a421d2d2864178c15bd0bb0c54c1287457ee055ed6ac22a0926c3b7c77dfc',\
        \ 'src/tools_ears_pro.rs': '829d72508b349d64c9e36ac4c65e76819143a98161aae53dadaf7a35e21babec'}\n\
        for f,h in expected.items():\n assert hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest()==h,f\n\
        PYCODE\ngit config user.name 'github-actions[bot]'\ngit config user.email\
        \ '41898282+github-actions[bot]@users.noreply.github.com'\ngit add src/gui/views.rs\
        \ src/tools_ears_pro.rs\ngit commit -m \"Choose explicit project track for\
        \ Vocal Room\"\ngit fetch origin vocal-source main\n[ \"$(git rev-parse origin/vocal-source)\"\
        \ = \"$GITHUB_SHA\" ]\n[ \"$(git rev-parse origin/main)\" = e3163461f427c44cae3279f7af6262aceb2ac4ac\
        \ ]\ngit push origin HEAD:refs/heads/vocal-source\n"
