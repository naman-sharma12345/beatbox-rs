name: Publish send removal clip preservation validation
'on':
  push:
    branches:
    - send-removal
    paths:
    - .github/workflows/*publish-v262.yml
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'naman-sharma12345/beatbox-rs' && github.actor == 'naman-sharma12345'
      && github.ref == 'refs/heads/send-removal'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Apply exact locally tested sample preservation patch
      shell: bash
      run: 'set -euo pipefail

        [ "$(git rev-parse HEAD^)" = 266d0d88794a3c59dc691146b5d6d269cc805765 ]

        [ "$(git rev-parse origin/main)" = 266d0d88794a3c59dc691146b5d6d269cc805765
        ]

        python3 - <<''PYCODE''

        import base64,gzip,hashlib,pathlib

        b=gzip.decompress(base64.b64decode(''''))

        assert hashlib.sha256(b).hexdigest()==''df0d5a9b47cd04fb1fc21fd94a4dee626602b3ab049b61f16b5dade1b0561728''

        pathlib.Path(''/tmp/checked.patch'').write_bytes(b)

        PYCODE

        git apply --check /tmp/checked.patch

        git apply /tmp/checked.patch

        python3 - <<''PYCODE''

        import hashlib,pathlib

        expected={''src/tools_studio.rs'': ''2906881adfb1f814b053daf88674f5adb2cf66b67e24a84dcde570bef88e9fb7'',
        ''tests/send_remove_targets.rs'': ''b5b72fe45f8d79290deb07739dbc3bd0c330b60eccd2fd45bdad334d2c82cef1''}

        for f,h in expected.items(): assert hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest()==h,f

        PYCODE

        git config user.name ''github-actions[bot]''

        git config user.email ''41898282+github-actions[bot]@users.noreply.github.com''

        git add src/tools_studio.rs tests/send_remove_targets.rs

        git commit -m "Clear deleted send automation clips"

        git fetch origin send-removal main

        [ "$(git rev-parse origin/send-removal)" = "$GITHUB_SHA" ]

        [ "$(git rev-parse origin/main)" = 266d0d88794a3c59dc691146b5d6d269cc805765
        ]

        git push origin HEAD:refs/heads/send-removal

        '
