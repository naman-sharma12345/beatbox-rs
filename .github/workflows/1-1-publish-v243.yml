name: Publish clear sample edit results and safe repeated slicing
'on':
  push:
    branches:
    - slice-guard
    paths:
    - .github/workflows/*publish-v243.yml
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'naman-sharma12345/beatbox-rs' && github.actor == 'naman-sharma12345'
      && github.ref == 'refs/heads/slice-guard'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Apply exact locally tested sample preservation patch
      shell: bash
      run: 'set -euo pipefail

        [ "$(git rev-parse HEAD^)" = 73cf025267f3e9b3b84477dcaa853f3fcc059b3d ]

        [ "$(git rev-parse origin/main)" = 73cf025267f3e9b3b84477dcaa853f3fcc059b3d
        ]

        python3 - <<''PYCODE''

        import base64,gzip,hashlib,pathlib

        b=gzip.decompress(base64.b64decode(''''))

        assert hashlib.sha256(b).hexdigest()==''ec90096a4a9b351b41a1d816f429f2b524495357833a1e892910e9d9dfafdb1b''

        pathlib.Path(''/tmp/checked.patch'').write_bytes(b)

        PYCODE

        git apply --check /tmp/checked.patch

        git apply /tmp/checked.patch

        python3 - <<''PYCODE''

        import hashlib,pathlib

        expected={''src/gui/browser_view.rs'': ''e15a0bc7e3732dfe510daa67f0ed82ae39b98feab92ef6a832b99b6c5a393c09'',
        ''tests/own_samples.rs'': ''0db29f6ee449ac5ae613bdc40f71f939f6061b7fa2f8bae7429d28bda933edbf''}

        for f,h in expected.items(): assert hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest()==h,f

        PYCODE

        git config user.name ''github-actions[bot]''

        git config user.email ''41898282+github-actions[bot]@users.noreply.github.com''

        git add src/gui/browser_view.rs tests/own_samples.rs

        git commit -m "Keep repeated GUI slicing separate and name edit results"

        git fetch origin slice-guard main

        [ "$(git rev-parse origin/slice-guard)" = "$GITHUB_SHA" ]

        [ "$(git rev-parse origin/main)" = 73cf025267f3e9b3b84477dcaa853f3fcc059b3d
        ]

        git push origin HEAD:refs/heads/slice-guard

        '
