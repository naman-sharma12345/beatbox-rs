name: Publish stereo analysis validation
'on':
  push:
    branches:
    - stereo-analysis
    paths:
    - .github/workflows/*publish-v255.yml
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'naman-sharma12345/beatbox-rs' && github.actor == 'naman-sharma12345'
      && github.ref == 'refs/heads/stereo-analysis'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Apply exact locally tested sample preservation patch
      shell: bash
      run: 'set -euo pipefail

        [ "$(git rev-parse HEAD^)" = 1d3b8403e761d517cca192a37ad3cd6f0400886a ]

        [ "$(git rev-parse origin/main)" = 1d3b8403e761d517cca192a37ad3cd6f0400886a
        ]

        python3 - <<''PYCODE''

        import base64,gzip,hashlib,pathlib

        b=gzip.decompress(base64.b64decode(''''))

        assert hashlib.sha256(b).hexdigest()==''4110197d465f092e13c162550db869348f28a54d3ba29585a67d1c938ab98cba''

        pathlib.Path(''/tmp/checked.patch'').write_bytes(b)

        PYCODE

        git apply --check /tmp/checked.patch

        git apply /tmp/checked.patch

        python3 - <<''PYCODE''

        import hashlib,pathlib

        expected={''src/analysis.rs'': ''6ae3fb164564c15f3fe9613441b7092c550130c19876f38ea1f8d11e35bfbee0'',
        ''tests/stereo_analysis.rs'': ''8a7ed13bb0bfa65401b553d19adf1d31661133c59ace4036ecb59b29f3dfa9a6''}

        for f,h in expected.items(): assert hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest()==h,f

        PYCODE

        git config user.name ''github-actions[bot]''

        git config user.email ''41898282+github-actions[bot]@users.noreply.github.com''

        git add src/analysis.rs tests/stereo_analysis.rs

        git commit -m "Measure stereo spectral energy without mono cancellation"

        git fetch origin stereo-analysis main

        [ "$(git rev-parse origin/stereo-analysis)" = "$GITHUB_SHA" ]

        [ "$(git rev-parse origin/main)" = 1d3b8403e761d517cca192a37ad3cd6f0400886a
        ]

        git push origin HEAD:refs/heads/stereo-analysis

        '
