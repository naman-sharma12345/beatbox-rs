name: Publish single-render translation preparation
'on':
  push:
    branches:
    - translation-set
    paths:
    - .github/workflows/*publish-v232.yml
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'naman-sharma12345/beatbox-rs' && github.actor == 'naman-sharma12345'
      && github.ref == 'refs/heads/translation-set'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Apply exact tested translation set patch
      shell: bash
      run: "set -euo pipefail\n[ \"$(git rev-parse HEAD^)\" = 7c0c91b52e7064ba9d9775e1e1434a3d40839c47\
        \ ]\n[ \"$(git rev-parse origin/main)\" = 7c0c91b52e7064ba9d9775e1e1434a3d40839c47\
        \ ]\npython3 - <<'PYCODE'\nimport base64,gzip,hashlib,pathlib\nb=gzip.decompress(base64.b64decode(''))\n\
        assert hashlib.sha256(b).hexdigest()=='389c5f7ba31a74ee2a8be387f89808968e34da21452b714d799c74a545ed4cdb'\n\
        pathlib.Path('/tmp/verified.patch').write_bytes(b)\nPYCODE\ngit apply --check\
        \ /tmp/verified.patch\ngit apply /tmp/verified.patch\npython3 - <<'PYCODE'\n\
        import hashlib,pathlib\nexpected={'src/gui/browser_view.rs': '461383368f434c710ec119dbffeff745b7255448d6160c5fb6ab19dcc4b30954',\
        \ 'src/tools_chain.rs': 'b406827e3545341b1256f891d65ccf5cbb0b779faf2307b0d1a0b37f211aa0a6',\
        \ 'src/tools_categories.rs': '986bf286524ed9e249fdf6baa4103a8507208cdc7ea342a505c40a8e1cc70dea'}\n\
        for f,h in expected.items():\n assert hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest()==h,f\n\
        PYCODE\ngit config user.name 'github-actions[bot]'\ngit config user.email\
        \ '41898282+github-actions[bot]@users.noreply.github.com'\ngit add src/gui/browser_view.rs\
        \ src/tools_chain.rs src/tools_categories.rs\ngit commit -m \"Prepare translation\
        \ versions together from one source render\"\ngit fetch origin translation-set\
        \ main\n[ \"$(git rev-parse origin/translation-set)\" = \"$GITHUB_SHA\" ]\n\
        [ \"$(git rev-parse origin/main)\" = 7c0c91b52e7064ba9d9775e1e1434a3d40839c47\
        \ ]\ngit push origin HEAD:refs/heads/translation-set\n"
